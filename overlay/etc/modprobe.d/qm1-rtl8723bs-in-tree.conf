# QM1 内置 Realtek RTL8723BS（SDIO）的驱动参数（发行版内置 staging 驱动）
#
# r8723bs 是 Realtek 私有协议栈（未迁到 mac80211），它的省电不归
# wifi.powersave 管，而是由驱动自己的模块参数决定：
#   rtw_power_mgnt  PS 模式，0 = PS_MODE_ACTIVE（永不休眠），1 = PS_MODE_MIN（默认，允许省电）
#   rtw_smart_ps    智能省电档位，0 = 关闭
#   rtw_ips_mode    空闲省电，0 = IPS_NONE（关闭），1 = IPS_NORMAL（默认）
#   rtw_bw_mode     信道带宽，0 = 20MHz，1 = 40MHz（默认）
#
# 为什么关掉这些：
#   * 省电（Leisure PS）一旦进入，离开要看门狗计时 2 秒且要求 xmit_cnt > 8，
#     所以空闲后重新发流的头 2 秒 TX 可能仍被 rtw_register_tx_alive() 挡住，
#     对长连接（SSH / agent 流）表现为「刚恢复就卡一下」。
#   * 40MHz 在这批 8723BS 模组上有社区报告的随机断连。
#   * 注意驱动没有 cfg80211 的 set_power_save，iw dev wlan0 set power_save off
#     对它无效，只能靠这里的模块参数。
#
# 这只是参数层面的止血。staging 版还存在若干永久卡死路径（丢一次 SDIO 中断
# 即可能让 TX 队列再也不被踢、TxOQT 等待无超时自旋、子队列停了不 restart、
# TX 线程 100% CPU 空转），要根治得用打了补丁的外部模块 r8723bs_qm1，
# 见 scripts/rtl8723bs-module.README.md。
#
# 需要恢复默认：删掉本文件后 rmmod/modprobe r8723bs。
options r8723bs rtw_power_mgnt=0 rtw_smart_ps=0 rtw_ips_mode=0 rtw_bw_mode=0
