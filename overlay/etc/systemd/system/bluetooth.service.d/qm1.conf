# 蓝牙控制器由**内核** hci_uart（含 hci_h5 的 3WIRE 协议）+ btrtl 初始化：
# Realtek RTL8723BS 的 BT 部分经 ACPI UART 挂在主机上（ACPI HID OBDA8723 /
# OBDA0623），内核 btrtl 按名字取 rtl_bt/rtl8723bs_fw.bin 与
# rtl_bt/rtl8723bs_config-OBDA8723.bin 下发厂商固件。
#
# qm1-bluetooth.service 负责把模块加载好并等 hci0 出现；bluez 在它之后启动，
# 免得 bluez 早于控制器就绪。
#
# （这里曾经配的是用户态 rtk_hciattach 路线 —— 已删除，理由见
#   overlay/etc/systemd/system/qm1-bluetooth.service 的注释。）
[Unit]
After=qm1-bluetooth.service
Wants=qm1-bluetooth.service
