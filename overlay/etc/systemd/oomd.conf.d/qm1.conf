[OOM]
# 内存压力下优先杀掉占用最大的服务（systemd-oomd）
#
# system.slice 和 user.slice 都要监控：
#   * system.slice 里是 sshd / journald / networkd / resolved —— 杀这里的进程
#     会直接打断"SSH 可登"这条交付口径；
#   * user.slice 里才是真正吃内存的 Chromium（约 200~300 MiB）与 Hermes
#     —— 只监控 system.slice 的话，元凶毫发无损，倒霉的是 sshd。
ManagedOOMMemoryPressure=system.slice user.slice:MemoryPressureThreshold=60%
# zram 开着（768 MiB zstd）时，交换压力也纳入监控：压缩内存用满之前
# 先让 oomd 收一收，而不是等内核 OOM killer 直接杀进程。
ManagedOOMSwap=system.slice user.slice:MemorySwapMax=90%
