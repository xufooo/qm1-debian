# QM1 Wi-Fi —— 填入 SSID/PSK 后启用 qm1-wifi@wlan0.service
# country=CN：遵循当地监管域；内置 RTL8723BS 只支持 2.4GHz。
country=CN
ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev
update_config=1
eapol_version=2
ap_scan=1
fast_reauth=1
# 内置 RTL8723BS 出货走的是树外单模块 rtw88_qm1（上游 rtw88 回移到 6.12），
# 发行版的 staging 驱动 r8723bs 已被 blacklist —— 它有永久卡死路径
# （丢一次 SDIO 中断就可能再也不恢复）。rtw88 是 mac80211 驱动，功耗由
# 固件与 /etc/modprobe.d/qm1-rtw88-8723bs.conf 里的 disable_lps_deep=y 等
# 参数控制。

# 示例（取消注释并替换后重启 qm1-wifi@wlan0）：
# network={
#     ssid="你的SSID"
#     psk="你的密码"
#     key_mgmt=WPA-PSK SAE
#     sae_password="你的密码"
#     ieee80211w=1
# }
#
# 注意：这套固件只验证过 WPA2-PSK。路由器若开 WPA3-only，可能关联失败 ——
# 请改 WPA2-PSK 或 WPA2/WPA3 混合模式。
