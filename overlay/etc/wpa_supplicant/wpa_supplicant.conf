# QM1 Wi-Fi —— 填入 SSID/PSK 后启用 qm1-wifi@wlan0.service
# country=CN 以允许 5GHz 的 149–165 信道（境内常用）
country=CN
ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev
update_config=1
eapol_version=2
ap_scan=2
fast_reauth=1
# 内置 RTL8723BS 走 staging 驱动 r8723bs（Realtek 私有协议栈，不受
# mac80211 的 wifi.powersave 控制）。它的省电由驱动模块参数 rtw_power_mgnt /
# rtw_ips_mode 决定，已在 /etc/modprobe.d/qm1-rtl8723bs-in-tree.conf 里关掉 ——
# 省电状态下 TX 会被挡住（离开省电的看门狗是 2 秒），长连接会表现为「刚恢复
# 就卡一下」。

# 示例（取消注释并替换后重启 qm1-wifi@wlan0）：
# network={
#     ssid="你的SSID"
#     psk="你的密码"
# }
#
# 注意：r8723bs 只支持 WPA2-PSK（无 WPA3/SAE）。
# 路由器若开 WPA3-only，关联会失败 —— 请改 WPA2-PSK 或 WPA2/WPA3 混合模式。
