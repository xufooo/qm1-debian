# QM1 Wi-Fi —— 填入 SSID/PSK 后启用 qm1-wifi@wlan0.service
# country=CN 以允许 5GHz 的 149–165 信道（境内常用）
country=CN
ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev
update_config=1
eapol_version=2
ap_scan=2
fast_reauth=1

# 示例（取消注释并替换后重启 qm1-wifi@wlan0）：
# network={
#     ssid="你的SSID"
#     psk="你的密码"
# }
