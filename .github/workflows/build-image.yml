name: build-image

# QM1 / Atom Z3735F: Debian amd64 with IA32 + x64 GRUB EFI loaders.
# eMMC/SD: sdhci_acpi + mmc_block; graphics: i915; HDMI: LPE or HDA.
# Wi-Fi: RTL8723BS SDIO with the pinned rtw88 backport; Bluetooth: UART H5.
# This workflow builds an OS base, without preinstalled agent/browser applications.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "目标架构（本项目只做 64 位系统；32 位 EFI 引导器仍然保留）"
        type: choice
        options: [amd64]
        default: amd64
      profile:
        description: "系统底座（应用由用户自行安装）"
        type: choice
        options: [base]
        default: base
      disk_size_gib:
        description: "整机镜像大小（GiB），应略小于 eMMC 容量（32GB eMMC 建议 30）"
        type: string
        default: "30"
      upload_images:
        description: "是否上传镜像产物（体积大，分钟级）"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "hooks/**"
      - "overlay/**"
      # 树外模块的本地补丁（patches/rtw88/）直接进到镜像里的 rtw88 模块，
      # 只改补丁不改脚本时也必须重建镜像。
      - "patches/**"
      - ".github/workflows/build-image.yml"
  schedule:
    # 每周一 03:00 UTC —— 验证 Debian 仓库侧变化没有把构建打断
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 容器作业里 GitHub 默认用 sh（dash），不支持 <(...) 进程替换等 bash 语法 →
    # 显式声明 bash，脚本与校验步骤才能一致
    defaults:
      run:
        shell: bash
    # debootstrap 需要在 chroot 里挂载 /proc /dev /sys → 容器必须 privileged
    container:
      image: debian:trixie-slim
      options: --privileged
    env:
      # 目标架构：workflow_dispatch 时取输入，push/schedule 时默认 amd64
      QM1_TARGET_ARCH: ${{ inputs.arch || 'amd64' }}
      # 固定内核 point release：Debian 13 元包当前给的是 6.12.107-1，
      # 而 rtl8723bs 的 2026 安全修复（kfree_sensitive、WMM IE 长度校验、
      # WPA IE 越界读、监控帧长度校验）从 6.12.111 才回移进 6.12.y。
      # 钉死后由 hooks/customize02-drivers.sh 从 trixie-proposed-updates 精确安装，
      # 装不上直接失败，不静默回退到元包。
      QM1_KERNEL_VERSION: 6.12.113
      QM1_KERNEL_ABI: 6.12.113+deb13-amd64
      # 启动关键路径：缺任一项都意味着 QM1 认不到 eMMC/ESP，插电起不来 → CI 必须失败
      # 名称与驱动清单（driver-manifest.txt）里的模块名一致（连字符形式）
      QM1_CRITICAL_MODULES: sdhci-pci sdhci-acpi mmc_block vfat ext4
      # 硬件相关的非关键驱动：缺失只告警（写进 driver-manifest.txt）
      QM1_OPTIONAL_MODULES: i915 snd-hdmi-lpe-audio snd-hda-intel snd-hda-codec-hdmi btusb ehci-pci xhci-hcd usb-storage usbnet r8152 asix brcmfmac iwlwifi rtw88
      # 编译进内核（=y，没有 .ko）的驱动：只能核对内核 config，不能用 modinfo
      QM1_BUILTIN_MODULES: acpi intel_idle thermal rtc_cmos
      # 必须装进镜像的 firmware 包（non-free-firmware 组件）
      QM1_REQUIRED_FIRMWARE: firmware-linux-free firmware-brcm80211 firmware-realtek firmware-atheros firmware-iwlwifi
    steps:
      - uses: actions/checkout@v4

      # runner 磁盘默认只有 ~14G 可用，mmdebstrap + 解包 + ext4 镜像会吃满
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install build dependencies
        run: |
          set -eux
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            mmdebstrap debian-archive-keyring mtools dosfstools e2fsprogs fdisk util-linux \
            grub2-common file ca-certificates curl wget gnupg gpgv xz-utils zstd procps kmod \
            initramfs-tools cpio qemu-system-x86
          # 两个架构的 EFI 模块：grub-mkimage 与 .mod 必须同版本，
          # 所以直接用 trixie 仓库里的同一套 grub2-common + grub-efi-*-bin
          dpkg --add-architecture i386
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            grub-efi-ia32-bin:i386 grub-efi-amd64-bin:amd64

      - name: Install pinned kernel headers (for the patched Wi-Fi module)
        if: env.QM1_TARGET_ARCH == 'amd64'
        run: |
          set -eux
          # 6.12.113 还在 trixie-proposed-updates 里（主仓库当前是 6.12.107-1）
          echo 'deb http://deb.debian.org/debian trixie-proposed-updates main' \
            > /etc/apt/sources.list.d/qm1-proposed.list
          apt-get update -qq
          # 头文件 + 内核本体：装 -unsigned 变体，避免拉 grub-efi-amd64-signed
          #（会跟本项目自带的 BOOTIA32/BOOTX64 双引导器抢 EFI 目录）
          apt-get install -y -qq --no-install-recommends \
            "linux-headers-${QM1_KERNEL_ABI}" \
            "linux-image-${QM1_KERNEL_ABI}-unsigned" \
            build-essential patch kmod dpkg curl git ca-certificates
          test -d "/lib/modules/${QM1_KERNEL_ABI}/build"

      - name: Build patched RTL8723BS module (r8723bs_qm1)
        if: env.QM1_TARGET_ARCH == 'amd64'
        run: |
          set -eux
          # 模块的 vermagic 写死了目标内核版本，必须与镜像里的内核完全一致
          bash scripts/build-rtl8723bs-module.sh --kver "${QM1_KERNEL_ABI}"
          ls -l build/wifi-module/

      - name: Build rtw88 RTL8723BS module (upstream backport)
        if: env.QM1_TARGET_ARCH == 'amd64'
        run: |
          # 上游把 RTL8723B/BS 并进 rtw88 之后，还没有发行版内核带着它
          # （sid 内核 7.2 < 7.4），所以按镜像内核回移成树外模块。
          # 构建失败不阻断流水线：回退到打了补丁的 staging 模块。
          # 优先用上游整树回移的模块（上游真正的 RTL8723B/BS 支持）。
          if bash scripts/build-rtw88-8723bs-module.sh \
               --kver "${QM1_KERNEL_ABI}" \
               --out-dir build/rtw88-module \
               --source upstream-full; then
            # 注意：GITHUB_ENV 的变量名不能带短横线 —— bash 的 ${name-word} 会把
            # "rtw88-module" 当成 "${rtw88}" 再跟字面量 "-module"，展开结果永远
            # 不等于 "ok"，根治模块会被静默丢掉、镜像里只剩会永久卡死的 staging
            # 驱动。所以这里用下划线命名。
            echo "RTW88_MODULE=ok" >> "$GITHUB_ENV"
            ls -l build/rtw88-module/
          else
            echo "::warning::rtw88 回移模块构建失败，回退到打了补丁的 staging 模块"
            echo "RTW88_MODULE=fallback" >> "$GITHUB_ENV"
          fi

      - name: Build root filesystem (mmdebstrap + hooks)
        run: |
          set -eux
          ARCH="${{ inputs.arch || 'amd64' }}"
          EXTRA=()
          if [ "$ARCH" = "amd64" ]; then
            # 钉死内核 point release（6.12.113），并装上 Wi-Fi 驱动
            EXTRA+=(--kernel-version "${QM1_KERNEL_VERSION}")
            if [ "${RTW88_MODULE:-fallback}" = "ok" ]; then
              EXTRA+=(--rtw88-module-deb "$(ls build/rtw88-module/*.deb | head -1)")
            else
              EXTRA+=(--wifi-module-deb "$(ls build/wifi-module/*.deb | head -1)")
            fi
          fi
          bash scripts/build-rootfs.sh \
            --out build/rootfs \
            --arch "$ARCH" \
            --profile "${{ inputs.profile || 'base' }}" \
            ${EXTRA[@]+"${EXTRA[@]}"}

      - name: Validate shipped systemd units
        run: bash scripts/verify-systemd-units.sh build/rootfs

      - name: Build image artifacts (ESP + rootfs + manifest)
        run: |
          bash scripts/build-image.sh \
            --rootfs build/rootfs \
            --out-dir build/out \
            --arch "${{ inputs.arch || 'amd64' }}" \
            --profile "${{ inputs.profile || 'base' }}" \
            --installer \
            --disk-size-gib "${{ inputs.disk_size_gib || 30 }}"

      - name: Boot the image once under QEMU (smoke test)
        run: |
          set -eu
          # 这是整条链路里唯一一处"真的启动一次"：前面的检查全是静态的
          # （文件在不在、软链指向哪、参数写对没有），全绿也不代表刷上去
          # 能开机。QEMU 里没有 RTL8723BS、没有 8250、没有真实 eMMC，
          # 所以它替代不了真机验收 —— 但"内核起不来 / initrd 找不到根 /
          # systemd 起不来 / 账号没建 / DNS 链没挂上"这一整类问题，
          # 在这里就能挡下来。
          bash scripts/boot-smoke.sh \
            --rootfs build/out/rootfs.img \
            --timeout 420 \
            --log build/out/boot-smoke.log
          tail -40 build/out/boot-smoke.log || true

      - name: Verify artifacts
        run: |
          set -eux
          cat build/out/manifest.txt
          # 校验清单里的 sha256（不依赖 bash 进程替换，sh 下也能跑）
          sed -n '/^--- sha256 ---$/,$p' build/out/manifest.txt | tail -n +2 > build/out/SHA256SUMS
          ( cd build/out && sha256sum -c SHA256SUMS )
          file build/out/bootloaders/grub2ia32.efi build/out/bootloaders/grubx64.efi
          mdir -/ -i build/out/esp.img ::/EFI/BOOT | tee build/out/esp-listing.txt
          mdir -/ -i build/out/esp.img ::/ | tee -a build/out/esp-listing.txt
          # mdir 按 8.3 短名显示（"BOOTIA32 EFI"、"grub     cfg"，点号被显示成空格），
          # 所以按文件名主干断言，不按带点号的完整名。
          for f in BOOTIA32 BOOTX64 grub ; do
            grep -q "$f" build/out/esp-listing.txt || { echo "::error::ESP 缺少 $f"; exit 1; }
          done
          grep -q 'vmlinuz' build/out/esp-listing.txt || { echo "::error::ESP 缺少内核"; exit 1; }
          grep -q 'initrd' build/out/esp-listing.txt || { echo "::error::ESP 缺少 initrd"; exit 1; }
          # ★ grub.cfg 必须真的有菜单项。
          #   原来的 awk 用 `next` 把 menuentry 的**头**也吞掉了，生成的
          #   grub.cfg 里一条 menuentry 都没有（只剩块体和孤立的 }）——
          #   机器开机进 GRUB 后是个哑菜单，什么都选不了。
          mcopy -i build/out/esp.img ::/EFI/BOOT/grub.cfg build/out/grub-from-esp.cfg
          MENUS="$(grep -c '^menuentry ' build/out/grub-from-esp.cfg || true)"
          [ "${MENUS:-0}" -ge 1 ] \
            || { echo "::error::ESP 里的 grub.cfg 一条 menuentry 都没有（哑菜单）"; exit 1; }
          echo "OK   ESP 的 grub.cfg 有 ${MENUS} 条菜单项"

          # ★ grub.cfg 里的 search 行必须指向 ESP 实际的 FAT32 卷标。
          #   卷标对不上，GRUB 就找不到引导分区：屏幕停在 GRUB 提示符或直接
          #   "error: no such device"，没有任何能指向原因的信息。
          ESP_LABEL="$(grep -o 'esp_label=[^ ]*' build/out/manifest.txt 2>/dev/null | head -1 | cut -d= -f2 || true)"
          [ -n "$ESP_LABEL" ] || ESP_LABEL=QM1ESP
          grep -q "^search --label $ESP_LABEL --set=root" build/out/grub-from-esp.cfg \
            || { echo "::error::grub.cfg 里没有 'search --label $ESP_LABEL --set=root'（GRUB 会找不到引导分区）"; exit 1; }
          echo "OK   grub.cfg 用 search --label $ESP_LABEL 定位引导分区"

      - name: Assert the rtw88 Wi-Fi module is inside the image
        run: |
          set -eu
          ROOT=build/rootfs
          source scripts/lib/ci-link-ok.sh
          KABI="${QM1_KERNEL_ABI}"
          # 根治模块必须真的进到镜像里。之前的 bug：GITHUB_ENV 里用了带短横线的
          # 变量名（rtw88-module），bash 里 "${rtw88-module:-fallback}" 展开成
          # 字面量 "module:-fallback"，判断永远为假 → 镜像里只剩会永久卡死的
          # staging 驱动，而流水线一路绿灯。这里把这条做成硬断言。
          if [ "${RTW88_MODULE:-fallback}" != "ok" ]; then
            echo "::error::rtw88 根治模块没有构建成功；镜像里只有已知存在永久卡死路径的 staging r8723bs，不能放行"
            exit 1
          fi
          # 两种布局都认：上游整树回移是单模块 rtw88_qm1，vendor 树是
          # rtw_8723bs + rtw_core + rtw_sdio + rtw_8723b。
          KO_DIR="$ROOT/lib/modules/${KABI}/extra/rtw88"
          if [ -f "$KO_DIR/rtw88_qm1.ko" ]; then
            MOD=rtw88_qm1
          elif [ -f "$KO_DIR/rtw_8723bs.ko" ]; then
            MOD=rtw_8723bs
            for f in rtw_core.ko rtw_sdio.ko rtw_8723b.ko; do
              [ -f "$KO_DIR/$f" ] \
                || { echo "::error::镜像里缺少 rtw88 模块 $f"; exit 1; }
            done
          elif [ -f "$KO_DIR/rtw88_8723bs.ko" ]; then
            # 上游"芯片回移"模式：只编 rtw8723bs.c，复用树内 rtw88 核心。
            MOD=rtw88_8723bs
          else
            echo "::error::镜像里没有 rtw88 模块（rtw88_qm1.ko / rtw_8723bs.ko / rtw88_8723bs.ko）"; exit 1
          fi
          [ -f "$ROOT/lib/firmware/rtw88/rtw8723b_fw.bin" ] \
            || { echo "::error::镜像里没有 rtw88 固件 rtw88/rtw8723b_fw.bin"; exit 1; }
          # ── 出货模块自身的三条硬事实 ─────────────────────────────────────
          # 这一段查的是**镜像里那份 .ko**，不是构建目录里的那份 ——
          # 之前所有关于"模块"的断言都是"文件在不在"，而真正的失败模式是
          # "文件在，但装上以后不干活"。下面三条各自对应一种静默失败：
          MOD_KO="$KO_DIR/$MOD.ko"
          [ -f "$MOD_KO" ] || { echo "::error::镜像里缺少模块文件 $MOD_KO"; exit 1; }
          # ① 认不认领这台机器的 SDIO 卡？
          #    内核靠 modalias 匹配设备；SDIO 的 modalias 由内核按
          #    "sdio:c*v%04Xd%04X*" 生成 —— vendor 四位大写十六进制、
          #    中间一个**小写 d** 分隔、device 四位大写十六进制，
          #    所以这张卡（vendor 0x024c / product 0xb723）的是
          #    "sdio:c*v024CdB723*"（CI 里 modinfo 打印出来的原样）。
          #    没有这条 alias ⇒ 模块加载成功、也不绑定那张卡 ⇒ 现象是
          #    "驱动在、wlan0 不出来"，而构建与校验全程绿灯。
          modinfo -F alias "$MOD_KO" | grep -qE '^sdio:c\*v024CdB723' \
            || { echo "::error::出货模块 $MOD 没有声明 0x024c:0xb723 的 SDIO alias"; \
                 modinfo -F alias "$MOD_KO" | sed 's/^/    alias: /'; exit 1; }
          # ② 装得进去吗？vermagic 与镜像里的内核 ABI 必须一致，
          #    否则 insmod 直接拒绝（"version magic ... should be ..."）。
          modinfo -F vermagic "$MOD_KO" | grep -q "^${KABI}" \
            || { echo "::error::出货模块 $MOD 的 vermagic 与镜像内核 $KABI 不一致"; exit 1; }
          # ③ 它要用的固件，镜像里真有吗？
          #    上游 rtw8723b.c 用 MODULE_FIRMWARE("rtw88/rtw8723b_fw.bin")
          #    声明固件；固件名一旦被上游改名，而我们还只发旧名字的 blob，
          #    现象是"驱动加载成功、wlan0 出来了、wpa 却连不上" ——
          #    这是最难查的一类，所以在这里把它钉死。
          _fw_list="$(modinfo -F firmware "$MOD_KO" 2>/dev/null || true)"
          if [ -n "$_fw_list" ]; then
            for _fw in $_fw_list; do
              [ -f "$ROOT/lib/firmware/$_fw" ] \
                || { echo "::error::出货模块 $MOD 要用固件 ${_fw}，镜像里却没有 /lib/firmware/$_fw"; exit 1; }
            done
          elif [ "$MOD" = "rtw88_qm1" ]; then
            echo "::error::出货模块 $MOD 没有声明任何固件（MODULE_FIRMWARE 为空）"
            exit 1
          fi
          grep -qx "$MOD" "$ROOT/etc/modules-load.d/qm1-hardware.conf" \
            || { echo "::error::modules-load.d 里没有 $MOD"; exit 1; }
          if grep -qxE 'r8723bs(_qm1)?' "$ROOT/etc/modules-load.d/qm1-hardware.conf"; then
            echo "::error::modules-load.d 里还留着 staging r8723bs / r8723bs_qm1，会和 rtw88 抢 SDIO 设备"
            exit 1
          fi
          # ★ 隔离分成两个文件：
          #   qm1-rtw88-8723bs.conf      → 树内 rtw88（必须一直在：出货模块导出的
          #                                符号与树内 rtw88_core 同名，撞车就装不上）
          #   qm1-rtl8723bs-fallback.conf → 树内 r8723bs 与树外 r8723bs_qm1
          #                                （现场没网时删掉它就能回退到 staging 模块）
          FB="$ROOT/etc/modprobe.d/qm1-rtl8723bs-fallback.conf"
          [ -f "$FB" ] \
            || { echo "::error::没有 ${FB}（现场没网时就没有退路了）"; exit 1; }
          grep -q 'rm /etc/modprobe.d/qm1-rtl8723bs-fallback.conf' "$FB" \
            || { echo "::error::$FB 里没写怎么切回 staging（现场唯一提示）"; exit 1; }
          # ★ 隔离必须有两道：blacklist 挡 udev 的 modalias 自动加载，
          #   install ... /bin/false 再挡一次显式 modprobe。
          #   少了任一道，树内 r8723bs 就会抢先绑定 SDIO 卡，
          #   于是"装了根治模块"却仍在用有永久卡死路径的老驱动 —— 而且一切看起来正常。
          grep -qx 'blacklist r8723bs' "$FB" \
            || { echo "::error::回退开关文件里没有 blacklist 树内 staging 驱动"; exit 1; }
          grep -qx 'install r8723bs /bin/false' "$FB" \
            || { echo "::error::回退开关文件里没有 install r8723bs /bin/false（隔离只有一道）"; exit 1; }
          # ★ 树内 rtw88 也要"安装屏蔽"，不能只有 blacklist。
          #   blacklist 只挡 udev 的 modalias 自动加载；显式 modprobe rtw88_sdio
          #   仍会把树内模块塞进去 —— 树内 rtw88_core 导出的是**同名**符号
          #   （rtw_core_init / rtw_register_hw / rtw_chip_info_setup …），
          #   与树外 rtw88_qm1 撞车，于是树外模块再也装不上去
          #   （insmod 报 Unknown symbol），现场表现是"驱动装上了却没 wlan0"。
          #   名单与 build 脚本的 INTREE_RTW88、verify-image.sh 的断言三处一致。
          # ★ 但绝不能要求"拉黑出货模块自己"：芯片回移模式（MOD=rtw88_8723bs）
          #   复用树内 rtw88 核心，把树内 rtw88 拉黑等于把出货模块拉死。
          if [ "$MOD" != "rtw88_8723bs" ]; then
            for m in rtw88_core rtw88_sdio rtw88_8723x rtw88_8723b rtw88_8723bs \
                     rtw88_usb rtw88_pci; do
              [ "$m" = "$MOD" ] && continue
              grep -qx "blacklist $m" "$ROOT/etc/modprobe.d/qm1-rtw88-8723bs.conf" \
                || { echo "::error::modprobe 配置里没有 blacklist ${m}（会与单模块 rtw88_qm1 符号冲突）"; exit 1; }
              grep -qx "install $m /bin/false" "$ROOT/etc/modprobe.d/qm1-rtw88-8723bs.conf" \
                || { echo "::error::modprobe 配置里没有 install $m /bin/false（隔离只有一道）"; exit 1; }
            done
          fi
          # ★ 打了 P1–P5 补丁的树外 staging 模块 r8723bs_qm1 也要挡：
          #   它带的是**同一个** SDIO device id（0x024c:0xb723），udev 照样会
          #   按 modalias 抢先加载它 —— 那就等于换了个名字的老驱动，
          #   永久卡死路径一条没少（现象：装了根治模块却仍在用老驱动）。
          for m in r8723bs_qm1; do
            grep -qx "blacklist $m" "$FB" \
              || { echo "::error::回退开关文件里没有 blacklist ${m}（树外 staging 模块会抢 SDIO 设备）"; exit 1; }
            grep -qx "install $m /bin/false" "$FB" \
              || { echo "::error::回退开关文件里没有 install $m /bin/false（隔离只有一道）"; exit 1; }
          done
          # ★ 模块包自带的 qm1-rtw88-8723bs.service 必须真的被启用：
          #   它的 ExecStartPre=-/sbin/modprobe -r r8723bs 是运行时兜底
          #   （万一树内驱动已经被抢先加载）。以前这个单元从来没被 enable，
          #   那个 modprobe -r 永远不执行 —— 看着有兜底、实际一点作用没有。
          U="$ROOT/etc/systemd/system/multi-user.target.wants/qm1-rtw88-8723bs.service"
          [ -L "$U" ] \
            || { echo "::error::qm1-rtw88-8723bs.service 没有被启用（运行时兜底是空的）"; exit 1; }
          link_ok "$U" \
            || { echo "::error::qm1-rtw88-8723bs.service 的 wants 链接是悬空的：$(link_target "$U")"; exit 1; }
          # modprobe 里的 options 只能写 rtw_core 真实存在的参数，写错参数会让
          # modprobe 直接拒绝加载模块（Invalid argument）。
          for p in disable_lps_deep support_bf debug_mask; do
            grep -q "options $MOD .*$p=" "$ROOT/etc/modprobe.d/qm1-rtw88-8723bs.conf" \
              || { echo "::error::modprobe 配置里缺少 $MOD 参数 $p"; exit 1; }
          done
          echo "OK   rtw88 根治模块、固件与开机加载项全部就位"

      - name: Assert the Bluetooth stack (kernel route) is inside the image
        run: |
          set -eu
          ROOT=build/rootfs
          source scripts/lib/ci-link-ok.sh
          # 内置蓝牙（Realtek RTL8723BS 的 BT 部分，ACPI HID OBDA8723/OBDA0623）
          # 走**内核**路线：hci_uart（含 hci_h5 的 3WIRE 协议）+ btrtl +
          # 发行版 firmware-realtek 的 rtl_bt/rtl8723bs_{fw.bin,config-OBDA8723.bin}。
          # 用户态 rtk_hciattach 路线已删除（与内核抢同一个串口，两边都没有 hci0）。
          for f in rtl8723bs_fw.bin rtl8723bs_config-OBDA8723.bin rtl8723bs_config-OBDA0623.bin; do
            [ -f "$ROOT/lib/firmware/rtl_bt/$f" ] \
              || { echo "::error::镜像里缺少蓝牙固件 rtl_bt/${f}（需要 firmware-realtek）"; exit 1; }
          done
          [ -f "$ROOT/etc/systemd/system/qm1-bluetooth.service" ] \
            || { echo "::error::镜像里没有 qm1-bluetooth.service"; exit 1; }
          # wants 链接必须能解析到真实单元（只看 -L 会被悬空链接骗过去）
          BT_LINK="$ROOT/etc/systemd/system/multi-user.target.wants/qm1-bluetooth.service"
          [ -L "$BT_LINK" ] \
            || { echo "::error::蓝牙服务没有开机自启（缺 multi-user.target.wants 链接）"; exit 1; }
          link_ok "$BT_LINK" \
            || { echo "::error::qm1-bluetooth.service 的 wants 链接是悬空的：$(link_target "$BT_LINK")"; exit 1; }
          # ★ 开机自检：也要由 timer 触发，单元要有超时，而且"报告里有 FAIL 行"
          #   不能算单元失败（否则整机变 degraded，真故障会被噪声淹没）。
          [ -f "$ROOT/etc/systemd/system/qm1-selftest.service" ] \
            || { echo "::error::镜像里没有 qm1-selftest.service"; exit 1; }
          [ -f "$ROOT/etc/systemd/system/qm1-selftest.timer" ] \
            || { echo "::error::镜像里没有 qm1-selftest.timer"; exit 1; }
          [ -x "$ROOT/usr/local/bin/qm1-selftest-report" ] \
            || { echo "::error::镜像里缺少可执行的 /usr/local/bin/qm1-selftest-report"; exit 1; }
          ST_LINK="$ROOT/etc/systemd/system/timers.target.wants/qm1-selftest.timer"
          [ -L "$ST_LINK" ] \
            || { echo "::error::开机自检定时器没有开机自启（缺 timers.target.wants 链接）"; exit 1; }
          link_ok "$ST_LINK" \
            || { echo "::error::qm1-selftest.timer 的 wants 链接是悬空的：$(link_target "$ST_LINK")"; exit 1; }
          grep -q '^Unit=qm1-selftest.service' "$ROOT/etc/systemd/system/qm1-selftest.timer" \
            || { echo "::error::qm1-selftest.timer 没有指向 qm1-selftest.service"; exit 1; }
          grep -q '^TimeoutStartSec=' "$ROOT/etc/systemd/system/qm1-selftest.service" \
            || { echo "::error::qm1-selftest.service 没有 TimeoutStartSec —— 自检卡住会把单元一直占着"; exit 1; }
          grep -q '^SuccessExitStatus=1' "$ROOT/etc/systemd/system/qm1-selftest.service" \
            || { echo "::error::qm1-selftest.service 没有 SuccessExitStatus=1 —— 报告里有 FAIL 行会把整机标成 degraded"; exit 1; }
          # 内核侧：hci_uart（编进 hci_h5）+ btrtl（厂商固件下发）都必须可用。
          # Debian 13 的 6.12.113+deb13-amd64 实测：
          #   CONFIG_BT_HCIUART=m / BT_HCIUART_SERDEV=y / BT_HCIUART_3WIRE=y / BT_RTL=m
          # hci_h5 编在 hci_uart.ko 里，btrtl 是独立模块。
          KCFG=$(ls "$ROOT"/boot/config-* 2>/dev/null | head -1 || true)
          [ -n "$KCFG" ] || { echo "::error::镜像里没有内核 config 文件，无法确认 CONFIG_BT_*"; exit 1; }
          for sym in CONFIG_BT_HCIUART CONFIG_BT_HCIUART_SERDEV CONFIG_BT_HCIUART_3WIRE CONFIG_BT_RTL; do
            grep -qE "^${sym}=(y|m)$" "$KCFG" \
              || { echo "::error::内核缺少 $sym —— 内核没法接管这台机的 Realtek BT UART"; exit 1; }
          done
          KVER=$(basename "$KCFG" | sed 's/^config-//')
          for mod in hci_uart btrtl; do
            find "$ROOT/lib/modules/$KVER" -name "$mod.ko*" -print -quit | grep -q . \
              || { echo "::error::镜像里找不到内核模块 $mod.ko"; exit 1; }
          done
          grep -q '^hci_uart$' "$ROOT/etc/modules-load.d/qm1-hardware.conf" \
            || { echo "::error::modules-load.d 里没有 hci_uart"; exit 1; }
          grep -q '^btrtl$' "$ROOT/etc/modules-load.d/qm1-hardware.conf" \
            || { echo "::error::modules-load.d 里没有 btrtl"; exit 1; }
          echo "OK   蓝牙内核路线就位（hci_uart + btrtl + rtl_bt 固件 + 开机自启）"

      - name: Assert the boot-to-usable baseline (DNS, account, Wi-Fi unit, fstab)
        run: |
          set -eu
          ROOT=build/rootfs
          source scripts/lib/ci-link-ok.sh

          # 1) DNS 必须有数据源。Debian 13 的 systemd 与 systemd-resolved
          #    两个包都**不带** /etc/resolv.conf（systemd-resolved 只带
          #    /usr/lib/systemd/resolv.conf 这个 stub）—— 镜像里如果既没有
          #    这个软链、又没有开 resolved，就是彻底没有 DNS：
          #    timesyncd 的 NTP 服务器名解析不了 ⇒ 时钟停在 1970 ⇒ TLS 全废。
          [ -L "$ROOT/etc/resolv.conf" ] \
            || { echo "::error::镜像里 /etc/resolv.conf 不是指向 resolved stub 的软链"; exit 1; }
          # ★ 比较**链接目标字符串**，不要去读文件内容：
          #   /etc/resolv.conf 是绝对软链 → /usr/lib/systemd/resolv.conf，
          #   在宿主上读它会被内核解析到**宿主的** /usr/lib/systemd/... （不存在）
          #   ⇒ grep 报 "No such file or directory"，把好的镜像判成坏的。
          #   （同一个坑：hook03 的 wants 链接、CI 的 link_ok，都要在目标根里解析。）
          [ "$(link_target "$ROOT/etc/resolv.conf")" = "/usr/lib/systemd/resolv.conf" ] \
            || { echo "::error::/etc/resolv.conf 指向的不是 resolved stub：$(link_target "$ROOT/etc/resolv.conf")"; exit 1; }
          link_ok "$ROOT/etc/resolv.conf" \
            || { echo "::error::/etc/resolv.conf 是悬空软链：$(link_target "$ROOT/etc/resolv.conf")"; exit 1; }
          RESOLVED_LINK="$ROOT/etc/systemd/system/multi-user.target.wants/systemd-resolved.service"
          link_ok "$RESOLVED_LINK" \
            || { echo "::error::systemd-resolved 没有开机自启（DNS 无数据源）：$(link_target "$RESOLVED_LINK")"; exit 1; }

          # 2) 必须有一个能登进来的账号，且**镜像里不留默认口令**
          #    （口令由安装器装机时随机生成并打印）。
          grep -q '^qm1:' "$ROOT/etc/passwd" \
            || { echo "::error::镜像里没有 qm1 账号 —— 装完之后没人能登进去"; exit 1; }
          QM1_SHADOW="$(getent shadow qm1 2>/dev/null | cut -d: -f2 || echo '')"
          case "$QM1_SHADOW" in
            '!'*|'*'|'')
              echo "OK   qm1 账号存在且口令已锁定（${QM1_SHADOW}）" ;;
            *)
              echo "::error::镜像里的 qm1 账号带着可用口令 —— 公开分发的镜像不能有通用口令"; exit 1 ;;
          esac

          # 3) Wi-Fi 单元必须真的被拉起，且 wants 链接不能是悬空的
          #    （只看 -L 会被悬空链接骗过去：单元在 /etc，链接指向 /lib 就永远起不来）。
          WIFI_UNIT="$ROOT/etc/systemd/system/qm1-wifi@.service"
          [ -f "$WIFI_UNIT" ] \
            || { echo "::error::镜像里没有 qm1-wifi@.service"; exit 1; }
          WIFI_LINK="$ROOT/etc/systemd/system/multi-user.target.wants/qm1-wifi@wlan0.service"
          [ -L "$WIFI_LINK" ] \
            || { echo "::error::qm1-wifi@wlan0.service 没有开机自启（缺 wants 链接）"; exit 1; }
          link_ok "$WIFI_LINK" \
            || { echo "::error::qm1-wifi@wlan0.service 的 wants 链接是悬空的：$(link_target "$WIFI_LINK")"; exit 1; }
          # 单元自己的超时必须够进程 fork 出来，
          # 否则 systemd 会在单元还没起来前就掐掉（Wi-Fi 永远起不来且无日志）。
          grep -qE '^TimeoutStartSec=(1[2-9][0-9]|[2-9][0-9]|[0-9]{3,})s$' "$WIFI_UNIT" \
            || { echo "::error::qm1-wifi@.service 的 TimeoutStartSec 小于 120s（会被提前掐掉）"; exit 1; }
          # ★ 等无线接口出现必须在 ExecStart 进程内部做，不能用 ExecStartPre。
          #   ExecStartPre 属于本单元的 start job，而 multi-user.target 因为
          #   Wants= 挂着本单元会被 systemd 隐式补上 After= ⇒ start job 不完成，
          #   multi-user.target 就到不了 ⇒ 整机没有 SSH、看起来像砖了。
          grep -q '^ExecStart=/usr/local/sbin/qm1-wifi-start' "$WIFI_UNIT" \
            || { echo "::error::qm1-wifi@.service 没有用 qm1-wifi-start 包装（等接口会在 start job 里拖住开机）"; exit 1; }
          if grep -qE '^ExecStartPre=.*ip link show' "$WIFI_UNIT"; then
            echo "::error::qm1-wifi@.service 还在 ExecStartPre 里等接口 —— 会拖住 multi-user.target"; exit 1
          fi
          [ -x "$ROOT/usr/local/sbin/qm1-wifi-start" ] \
            || { echo "::error::镜像里缺少可执行的 /usr/local/sbin/qm1-wifi-start"; exit 1; }

          # 4) fstab 必须有根分区条目：只有伪文件系统的话，
          #    systemd 不按 fstab 管理根、不跑 fsck-root。
          grep -qE '^[^#]*[[:space:]]/[[:space:]]' "$ROOT/etc/fstab" \
            || { echo "::error::fstab 里没有根分区（/）条目"; exit 1; }

          # 5) 全局启动超时不能是 30s：慢单元（Wi-Fi 进程 fork、蓝牙 hci0 出现）
          #    会被 30s 的全局上限直接杀掉（而且是在它还没报错之前）。
          grep -q 'TimeoutStartSec=30s' "$ROOT/etc/systemd/system.conf.d/quick-boot.conf" \
            && { echo "::error::全局 TimeoutStartSec 还是 30s —— 会掐掉慢单元"; exit 1; } || true
          grep -q '^DefaultTimeoutStartSec=120s' "$ROOT/etc/systemd/system.conf.d/quick-boot.conf" \
            || { echo "::error::全局 TimeoutStartSec 不是 120s"; exit 1; }
          echo "OK   开机即用的四项前提就位（DNS / 账号 / Wi-Fi 单元 / fstab）"

      - name: Assert the kernel config baseline for the Bay Trail quirks
        run: |
          set -eu
          ROOT=build/rootfs
          KCFG=$(ls "$ROOT"/boot/config-* 2>/dev/null | head -1 || true)
          [ -n "$KCFG" ] || { echo "::error::镜像里没有内核 config 文件"; exit 1; }
          # CONFIG_IOSF_MBI=y 是 Bay Trail 的 sdhci-acpi 挂死修复（上游 6e1c7d6103fe）
          # 真正生效的前提 —— 没有它，eMMC/SD 的挂死补丁等于没打。实测 Debian 13
          # 的 6.12.113+deb13-amd64 为 =y。
          grep -qE '^CONFIG_IOSF_MBI=y$' "$KCFG" \
            || { echo "::error::CONFIG_IOSF_MBI 不是 y —— Bay Trail 的 sdhci-acpi 挂死修复不会生效"; exit 1; }
          echo "OK   CONFIG_IOSF_MBI=y（Bay Trail eMMC/SD 挂死修复生效前提满足）"
          # 记录其余关键项（不作为失败条件，只作为镜像事实写进产物）
          for sym in CONFIG_X86_INTEL_PSTATE CONFIG_X86_ACPI_CPUFREQ CONFIG_PINCTRL_BAYTRAIL \
                     CONFIG_MMC_SDHCI_ACPI CONFIG_BT_HCIUART CONFIG_X86_ACPI_CPUFREQ; do
            val=$(grep -E "^${sym}=" "$KCFG" | head -1 | cut -d= -f2 || true)
            echo "INFO $sym=${val:-unset}"
          done
          # 内核参数必须带上 C-state 限制（Bay Trail C-state 冻结 bug 受影响名单含 Z3735F）
          grep -q 'intel_idle.max_cstate=1' scripts/grub.cfg.example \
            || { echo "::error::scripts/grub.cfg.example 缺少 intel_idle.max_cstate=1"; exit 1; }
          grep -q 'intel_idle.max_cstate=1' scripts/grub-installer.cfg.example \
            || { echo "::error::scripts/grub-installer.cfg.example 缺少 intel_idle.max_cstate=1"; exit 1; }
          echo "OK   内核参数含 intel_idle.max_cstate=1"

      - name: Assert the health collector is inside the image
        run: |
          set -eu
          ROOT=build/rootfs
          # 稳定性取证采集器：没有周期快照就判断不了"整机卡死 / eMMC 掉卡 / Wi-Fi 断流"
          # 到底发没发生，参数调整就成了盲改。
          [ -x "$ROOT/usr/local/sbin/qm1-health-collect" ] \
            || { echo "::error::镜像里没有 /usr/local/sbin/qm1-health-collect"; exit 1; }
          [ -x "$ROOT/usr/local/bin/qm1-stress" ] \
            || { echo "::error::镜像里没有 /usr/local/bin/qm1-stress"; exit 1; }
          for u in qm1-health-collect.service qm1-health-collect.timer; do
            [ -f "$ROOT/lib/systemd/system/$u" ] || [ -f "$ROOT/etc/systemd/system/$u" ] \
              || { echo "::error::镜像里缺少 systemd 单元 $u"; exit 1; }
          done
          [ -L "$ROOT/etc/systemd/system/timers.target.wants/qm1-health-collect.timer" ] \
            || { echo "::error::qm1-health-collect.timer 没有开机自启（缺 timers.target.wants 链接）"; exit 1; }
          grep -q 'mmc_error_lines=' "$ROOT/usr/local/sbin/qm1-health-collect" \
            || { echo "::error::采集器缺少 eMMC 错误计数（mmc_error_lines）"; exit 1; }
          grep -q 'hung task' "$ROOT/usr/local/sbin/qm1-health-collect" \
            || { echo "::error::采集器缺少挂死类内核抱怨计数"; exit 1; }
          echo "OK   稳定性取证采集器、定时器与压测脚本全部就位"

      - name: Assert the hardware fixups are inside the image
        run: |
          set -eu
          ROOT=build/rootfs
          # 每个功能都要真的能用：eMMC 不自动挂起、CPU 调频、HDMI 音频、蓝牙绑定
          [ -x "$ROOT/usr/local/sbin/qm1-hardware-fixups" ] \
            || { echo "::error::镜像里没有 /usr/local/sbin/qm1-hardware-fixups"; exit 1; }
          [ -f "$ROOT/lib/systemd/system/qm1-hardware-fixups.service" ] \
            || [ -f "$ROOT/etc/systemd/system/qm1-hardware-fixups.service" ] \
            || { echo "::error::镜像里缺少 systemd 单元 qm1-hardware-fixups.service"; exit 1; }
          [ -L "$ROOT/etc/systemd/system/multi-user.target.wants/qm1-hardware-fixups.service" ] \
            || { echo "::error::qm1-hardware-fixups.service 没有开机自启（缺 multi-user.target.wants 链接）"; exit 1; }
          [ -f "$ROOT/etc/default/qm1-hardware" ] \
            || { echo "::error::镜像里缺少 /etc/default/qm1-hardware"; exit 1; }
          for needle in 'power/control' 'scaling_governor' 'snd-hda-codec-hdmi' 'hci_uart'; do
            grep -q "$needle" "$ROOT/usr/local/sbin/qm1-hardware-fixups" \
              || { echo "::error::硬件修正脚本缺少 $needle 相关处理"; exit 1; }
          done
          echo "OK   硬件修正脚本、systemd 单元与自启链接全部就位"

      - name: Assert the eMMC runtime suspend switch is applied early (udev rule)
        run: |
          set -eu
          ROOT=build/rootfs
          RULE="$ROOT/etc/udev/rules.d/60-qm1-emmc-power.rules"
          # 开机第一次读根盘发生在 initramfs 阶段，任何 service 都来不及。
          # 关掉 eMMC 主机的 runtime suspend 必须靠 udev 规则。
          [ -f "$RULE" ] \
            || { echo "::error::镜像里缺少 ${RULE}（eMMC 会在读写中掉卡）"; exit 1; }
          grep -q 'ATTR{power/control}="on"' "$RULE" \
            || { echo "::error::udev 规则没有把 power/control 设成 on"; exit 1; }
          grep -q 'ATTR{power/autosuspend_delay_ms}="-1"' "$RULE" \
            || { echo "::error::udev 规则没有把 autosuspend_delay_ms 设成 -1"; exit 1; }
          grep -q '80860F14:00' "$RULE" \
            || { echo "::error::udev 规则没有覆盖 eMMC 的 ACPI 主机 80860F14:00"; exit 1; }
          echo "OK   eMMC runtime suspend 的 udev 规则就位"

      - name: Assert the Bluetooth helper reports failures instead of hiding them
        run: |
          set -eu
          ROOT=build/rootfs
          [ -x "$ROOT/usr/local/sbin/qm1-bluetooth-up" ] \
            || { echo "::error::镜像里没有 /usr/local/sbin/qm1-bluetooth-up"; exit 1; }
          grep -q '/run/qm1-bluetooth.failed' "$ROOT/usr/local/sbin/qm1-bluetooth-up" \
            || { echo "::error::蓝牙辅助脚本没有写失败标记文件"; exit 1; }
          grep -q 'OBDA8723' "$ROOT/usr/local/sbin/qm1-bluetooth-up" \
            || { echo "::error::蓝牙辅助脚本没有探测 OBDA8723（8250 抢占检测）"; exit 1; }
          grep -q 'qm1-bluetooth-up' "$ROOT/etc/systemd/system/qm1-bluetooth.service" \
            || { echo "::error::qm1-bluetooth.service 没有调用 qm1-bluetooth-up"; exit 1; }
          echo "OK   蓝牙等待与失败上报就位"

      - name: Assert the time sync and the bluetooth stack are enabled
        run: |
          set -euo pipefail
          ROOT=build/rootfs
          for unit in systemd-timesyncd.service bluetooth.service; do
            # systemd-timesyncd 由 timers.target 激活，bluetooth 由 multi-user.target。
            # 用 -L 判断：发行版单元的链接目标是 /lib/systemd/system/... 的绝对路径，
            # 在 runner 上这个路径不存在，只有链接本身在镜像里。
            if [ ! -L "$ROOT/etc/systemd/system/timers.target.wants/$unit" ] \
               && [ ! -L "$ROOT/etc/systemd/system/multi-user.target.wants/$unit" ]; then
              echo "::error::$unit 未在镜像里启用"
              echo "--- 诊断：rootfs=$ROOT"
              ls -la "$ROOT/etc/systemd/system/" 2>&1 | head -20
              ls -la "$ROOT/etc/systemd/system/timers.target.wants/" 2>&1 | head -10
              ls -la "$ROOT/etc/systemd/system/multi-user.target.wants/" 2>&1 | head -20
              find "$ROOT/etc/systemd/system" -maxdepth 2 -name '*timesyncd*' 2>&1 | head
              exit 1
            fi
          done
          [ -e "$ROOT/etc/systemd/system/bluetooth.service.d/qm1.conf" ] \
            || { echo "::error::缺少 bluetooth.service.d/qm1.conf（蓝牙栈要等厂商固件下发）"; exit 1; }
          grep -q "After=qm1-bluetooth.service" "$ROOT/etc/systemd/system/bluetooth.service.d/qm1.conf" \
            || { echo "::error::bluetooth 单元没有排在 qm1-bluetooth.service 之后"; exit 1; }
          echo "时间同步与蓝牙栈已启用"

      - name: Assert the first-boot provisioning is inside the image
        run: |
          set -eu
          ROOT=build/rootfs
          # 「开机即联网」的能力：首启时自动读 provisioning 文件，配好 Wi-Fi 与 SSH。
          # 少了它，装完系统还得接显示器键盘手动敲 wpa_supplicant —— 这正是要避免的。
          [ -x "$ROOT/usr/local/sbin/qm1-firstboot" ] \
            || { echo "::error::镜像里没有 /usr/local/sbin/qm1-firstboot"; exit 1; }
          [ -f "$ROOT/etc/systemd/system/qm1-firstboot.service" ] \
            || { echo "::error::镜像里没有 qm1-firstboot.service"; exit 1; }
          [ -L "$ROOT/etc/systemd/system/multi-user.target.wants/qm1-firstboot.service" ] \
            || { echo "::error::首启配置单元没有开机自启（缺 multi-user.target.wants 链接）"; exit 1; }
          [ -f "$ROOT/etc/systemd/system/qm1-wifi@.service" ] \
            || { echo "::error::镜像里没有 qm1-wifi@.service"; exit 1; }
          grep -q 'qm1-firstboot.service' "$ROOT/etc/systemd/system/qm1-wifi@.service" \
            || { echo "::error::Wi-Fi 单元没有排在首启配置之后（会先于 provisioning 启动）"; exit 1; }
          echo "OK   首启自动配置（Wi-Fi/SSH）就位"

      - name: Assert the installer supports the non-destructive path
        run: |
          set -eu
          ROOT=build/rootfs
          INSTALLER="$ROOT/usr/local/sbin/qm1-install-to-emmc"
          # 安装器要支持「非破坏性」路径：装到可移动介质、eMMC 不动
          grep -q -- '--mode' "$INSTALLER" \
            || { echo "::error::安装器缺少 --mode（无法选择非破坏性安装路径）"; exit 1; }
          grep -q 'qm1/provision' "$INSTALLER" \
            || { echo "::error::安装器没有把 provisioning 写进目标（装完不会自动联网）"; exit 1; }
          grep -q 'BACKUP_DIR' "$INSTALLER" \
            || { echo "::error::安装器没有备份流程（覆盖 eMMC 前必须能整盘备份）"; exit 1; }
          # 覆盖 eMMC 的路径必须是"完整备份 + 逐分区校验"，
          # 而不是只算备份文件自身的哈希（那样分区内容坏了也发现不了）。
          grep -q 'verify_backup_partitions' "$INSTALLER" \
            || { echo "::error::安装器没有逐分区校验备份"; exit 1; }
          grep -q 'qm1.install.mode' "$INSTALLER" \
            || { echo "::error::安装器不认 qm1.install.mode（GRUB 菜单无法指定装到哪）"; exit 1; }
          grep -q 'efibootmgr' "$INSTALLER" \
            || { echo "::error::安装器不登记 UEFI 启动项（装完可能要手动选启动设备）"; exit 1; }
          # 分区必须按分区类型认，不能按 lsblk 输出顺序猜
          grep -q 'PARTTYPE' "$INSTALLER" \
            || { echo "::error::安装器没有按 PARTTYPE 识别 ESP/根分区"; exit 1; }
          # 写盘校验失败必须中止，不能只 warn 完继续
          grep -q '写入校验失败 —— 中止' "$INSTALLER" \
            || { echo "::error::安装器写盘校验失败没有中止"; exit 1; }
          # 磁盘层面的判断被拆到库里了，安装器缺库就会直接退出 —— 必须真的
          # 在镜像里（这个库同时是 CI 里被合成 GPT 镜像验证过的那份）。
          [ -f "$ROOT/usr/local/lib/qm1/install-lib.sh" ] \
            || { echo "::error::镜像里缺少 /usr/local/lib/qm1/install-lib.sh（安装器会直接退出）"; exit 1; }
          grep -q 'install-lib.sh' "$INSTALLER" \
            || { echo "::error::安装器没有引用 install-lib.sh"; exit 1; }
          echo "OK   安装器支持非破坏性路径 + 备份(含逐分区校验) + provisioning + UEFI 启动项"

      - name: Assert the installers cannot silently claim success
        run: |
          set -eu
          # 这一组断言针对**装不上 / 装一半却报成功**这一类缺陷。
          # 它们历史上都真实发生过：
          #   * stat 对块设备返回 0 ⇒ "源大小 > 0"的断言在两次 dd 之后才炸，
          #     eMMC 留在写了一半的状态；
          #   * 源哈希在 remount rw 之后才算 ⇒ 源在 dd 期间被写过 ⇒
          #     一次成功的安装被判成失败；
          #   * 写完盘不重读分区表 ⇒ 找不到 ESP ⇒ EFI 启动项没登记却报成功；
          #   * EFI 启动项登记失败只 warn ⇒ 机器开不了机，报告却说装好了。
          # 这些只能靠"真跑一遍"彻底验证（scripts/test-installer-e2e.sh，
          # lint.yml 里以 root 跑），这里守的是**代码里不许再退回旧写法**。
          DEV=overlay/usr/local/sbin/qm1-install-to-emmc
          HOST=scripts/install-qm1.sh
          LIB=overlay/usr/local/lib/qm1/install-lib.sh

          # --- 设备侧安装器 ---
          # 块设备的大小必须用 blockdev --getsize64（stat 对块设备返回 0）
          grep -q 'blockdev --getsize64 "\$SRC_ESP"' "$DEV" \
            || { echo "::error::设备侧安装器没有用 blockdev --getsize64 读源 ESP 大小"; exit 1; }
          grep -q 'blockdev --getsize64 "\$SRC_ROOT"' "$DEV" \
            || { echo "::error::设备侧安装器没有用 blockdev --getsize64 读源根分区大小"; exit 1; }
          if grep -n 'stat -c%s' "$DEV" | grep -Eq 'SRC_(ESP|ROOT)'; then
            echo "::error::设备侧安装器又用 stat -c%s 读块设备大小了（对块设备恒为 0）"; exit 1
          fi
          # 源哈希必须在 dd **之前**算（remount rw 之后算 ⇒ 源在 dd 期间被写过 ⇒ 误判失败）
          hash_line="$(grep -n 'SRC_ROOT_HASH="' "$DEV" | head -1 | cut -d: -f1)"
          dd_line="$(grep -n 'dd if="\$SRC_ROOT"' "$DEV" | head -1 | cut -d: -f1)"
          [ -n "$hash_line" ] && [ -n "$dd_line" ] \
            || { echo "::error::设备侧安装器里找不到源哈希或 dd 的位置"; exit 1; }
          [ "$hash_line" -lt "$dd_line" ] \
            || { echo "::error::设备侧安装器在 dd 之后才算源哈希（源在复制期间被写过 ⇒ 会误判失败）"; exit 1; }
          # 校验失败必须能区分"源在变"和"真写坏了"
          grep -q 'esp_has_boot_files' "$DEV" \
            || { echo "::error::设备侧安装器没有目标侧引导文件检查（源漂移时无法定论）"; exit 1; }
          grep -q 'e2fsck -fn' "$DEV" \
            || { echo "::error::设备侧安装器没有对目标根分区做只读文件系统检查"; exit 1; }
          # useradd / chpasswd 失败必须致命（以前只 warn ⇒ 装完没有可登录账号）
          grep -q 'die "镜像里没有 useradd' "$DEV" \
            || { echo "::error::设备侧安装器缺少 useradd 时没有中止（镜像里没有 passwd 包）"; exit 1; }
          grep -q 'die "镜像里没有 chpasswd' "$DEV" \
            || { echo "::error::设备侧安装器缺少 chpasswd 时没有中止（镜像里没有 passwd 包）"; exit 1; }
          # 源与目标必须能由参数给定（CI 里没有真的 SDIO 卡 / ACPI eMMC）
          for opt in --source-root --source-esp --source-disk --lib --no-login-account; do
            grep -q -- "$opt" "$DEV" \
              || { echo "::error::设备侧安装器缺少参数 ${opt}（没法在环设备上验证）"; exit 1; }
          done
          # EFI 登记结果必须**有明确交代**（登记成功或明说没登记），
          # 而且登记不上时不能报成功 —— 固件里没有启动项，机器就开不了机。
          grep -q 'UEFI 启动项 : 未登记' "$DEV" \
            || { echo "::error::设备侧安装器没有交代 EFI 启动项的结果"; exit 1; }
          grep -q -- '--skip-efi-entry' "$DEV" \
            || { echo "::error::设备侧安装器没有显式跳过 EFI 登记的开关（只能悄悄跳过是不行的）"; exit 1; }
          grep -q 'EFI 启动项没有登记成功' "$DEV" \
            || { echo "::error::设备侧安装器 EFI 登记失败时没有判失败"; exit 1; }
          # 备份位置放不下 ⇒ 必须中止（不能"先写了再说"）：
          # 覆盖 eMMC 之前没有整盘备份，就等于没有退路。
          grep -q 'die "备份目录空间不足' "$DEV" \
            || { echo "::error::设备侧安装器在备份位置空间不足时没有中止"; exit 1; }
          # 备份校验必须发生在**写盘之前**：顺序反了就是"写完才发现备份是坏的"。
          _vbp_line="$(grep -n 'verify_backup_partitions' "$DEV" | tail -1 | cut -d: -f1)"
          _write_line="$(grep -n 'dd if="\$SRC_ROOT"' "$DEV" | head -1 | cut -d: -f1)"
          [ -n "$_vbp_line" ] && [ -n "$_write_line" ] \
            || { echo "::error::设备侧安装器里找不到备份校验或写盘的位置"; exit 1; }
          [ "$_vbp_line" -lt "$_write_line" ] \
            || { echo "::error::设备侧安装器在写盘之后才校验备份（备份坏了也已经写进去了）"; exit 1; }

          # --- 主机侧安装器 ---
          grep -q 'qm1_verify_backup' "$HOST" \
            || { echo "::error::主机侧安装器没有逐分区校验备份"; exit 1; }
          grep -q 'qm1_rescan_partitions' "$HOST" \
            || { echo "::error::主机侧安装器写完盘没有重读分区表（会找不到 ESP）"; exit 1; }
          grep -q 'qm1_plan_target_layout' "$HOST" \
            || { echo "::error::主机侧安装器没有按目标真实容量规划分区表"; exit 1; }
          grep -q 'qm1_write_target_layout' "$HOST" \
            || { echo "::error::主机侧安装器没有重建分区表"; exit 1; }
          grep -q 'resize2fs' "$HOST" \
            || { echo "::error::主机侧安装器没有把根文件系统撑到盘尾"; exit 1; }
          grep -q '目标盘上还有分区挂着' "$HOST" \
            || { echo "::error::主机侧安装器没有拒绝写入还挂着的目标分区"; exit 1; }
          # EFI 启动项登记失败必须判失败，不能 warn 完继续
          grep -q 'die "efibootmgr 登记启动项失败' "$HOST" \
            || { echo "::error::主机侧安装器 efibootmgr 失败时没有判失败"; exit 1; }
          grep -q 'die "当前不是以 UEFI 方式启动' "$HOST" \
            || { echo "::error::主机侧安装器在非 UEFI 环境下没有判失败"; exit 1; }
          grep -q 'die "没有 efibootmgr' "$HOST" \
            || { echo "::error::主机侧安装器缺少 efibootmgr 时没有判失败"; exit 1; }
          grep -q -- '--skip-efi-entry' "$HOST" \
            || { echo "::error::主机侧安装器没有显式跳过 EFI 登记的开关（只能悄悄跳过是不行的）"; exit 1; }

          # --- 两份磁盘库实现必须同名同在 ---
          # 构建链（scripts/lib/common.sh）与镜像内（install-lib.sh）各有一份，
          # 谁走样了，"CI 验过的备份校验"就不是真机上跑的那份了。
          for fn in qm1_hash_range qm1_partitions qm1_find_partition \
                    qm1_find_partition_by_type qm1_used_end_bytes qm1_verify_backup; do
            grep -q "^${fn}()" scripts/lib/common.sh \
              || { echo "::error::scripts/lib/common.sh 缺少 $fn"; exit 1; }
            grep -q "^${fn}()" "$LIB" \
              || { echo "::error::$LIB 缺少 $fn"; exit 1; }
          done

          # --- wpa_supplicant 取值规则：两份实现同名同在，写配置的人必须用它 ---
          # 这台机器没有 RJ45，Wi-Fi 连不上 = 整机断网。而 wpa 的取值规则
          # （64 位十六进制 PSK 不能加引号、空口令不能写 psk=、WPA3 要不要
          # 配 SAE）写错时**不会有任何报错**，只会安静地连不上。
          for fn in qm1_wpa_escape qm1_wpa_ssid_value qm1_wpa_psk_value \
                    qm1_wpa_sae_value qm1_wpa_key_mgmt_value; do
            grep -q "^${fn}()" scripts/lib/common.sh \
              || { echo "::error::scripts/lib/common.sh 缺少 $fn"; exit 1; }
            grep -q "^${fn}()" "$LIB" \
              || { echo "::error::$LIB 缺少 $fn（镜像里的安装器会找不到这个 helper）"; exit 1; }
          done
          # 写配置的两个脚本必须走共享 helper，而不是自己写死 key_mgmt ——
          # 自己写死的话，改了 common.sh 也不会生效。
          for w in "$DEV" scripts/provision-agent.sh; do
            grep -q 'qm1_wpa_key_mgmt_value' "$w" \
              || { echo "::error::$w 没有走共享的 key_mgmt 取值规则"; exit 1; }
            grep -q 'qm1_wpa_sae_value' "$w" \
              || { echo "::error::$w 没有走共享的 sae_password 取值规则（WPA3 路由器会连不上）"; exit 1; }
            if grep -q 'key_mgmt=WPA-PSK$' "$w"; then
              echo "::error::$w 里还有写死的 key_mgmt=WPA-PSK"; exit 1
            fi
          done

          # --- 镜像里必须有 passwd 包 ---
          # useradd/chpasswd 来自 passwd 包；缺了它安装器会在 [3/6] 中止。
          # 这里按"包列表里的独立一项"来匹配，避免被 chpasswd 之类的字符串蒙混过去。
          # BASE_PKGS 是多行续行写的，先把续行接起来再取值。
          pkg_line="$(sed -n '/^BASE_PKGS=/,/[^\\]$/p' scripts/build-rootfs.sh | tr -d '\n' | sed 's/\\//g')"
          pkg_list="${pkg_line#*=}"
          pkg_list="${pkg_list%\"}"
          pkg_list="${pkg_list#\"}"
          case ",${pkg_list}," in
            *,passwd,*) ;;
            *) echo "::error::scripts/build-rootfs.sh 的 BASE_PKGS 里没有 passwd 包"; exit 1 ;;
          esac

          # --- 中文标点不能直接跟在变量名后面 ---
          # 在 zh_CN.UTF-8 这类多字节 locale 下，bash 会把紧跟变量名的中文标点
          # 一起吃进变量名（"$TARGET（" 被当成变量 "TARGET（"）⇒ set -u 直接
          # 报 unbound variable 把脚本打断 —— 而且往往正好打断在装机流程中间。
          # 一律写成 "${TARGET}（"。
          # ★ 这里扫的是"全仓所有会被 shell 执行的文件"，不是一份固定名单。
          #   之前的守卫只查 7 个文件，结果同一个坑在 drv-selfcheck.sh、
          #   hooks/*.sh、overlay/usr/local/sbin/* 里又长出来 92 处 ——
          #   只要名单是手写的，它就一定会在名单之外复发。
          #   （DELIVERY.md 里那一处是文档在解释这个坑，不算。）
          python3 <<'PYGUARD'
          import re, subprocess, sys
          pat = re.compile(r'\$[A-Za-z_][A-Za-z0-9_]*[^\x00-\x7F]')
          # U+FFFD = 编码坏掉的字符。中文注释一旦被写坏，
          # 读的人会以为是自己看花了眼 —— 而且它通常是整段文字被截断，
          # 意思全丢了。宁可让 CI 报出来。
          fffd = []
          bad = []
          files = subprocess.run(['git', 'ls-files'], capture_output=True, text=True).stdout.split()
          for f in files:
              if f.startswith('.git/') or f.endswith(('.md', '.txt')):
                  continue
              is_sh = f.endswith(('.sh', '.yml', '.yaml'))
              # overlay 下那些没有扩展名的可执行脚本同样是 shell
              is_ovl = f.startswith('overlay/') and not f.endswith(('.conf', '.service', '.timer', '.rules', '.list', '.cfg'))
              if not (is_sh or is_ovl):
                  continue
              try:
                  lines = open(f, encoding='utf-8').read().split('\n')
              except Exception:
                  continue
              for i, line in enumerate(lines, 1):
                  if '\ufffd' in line:
                      fffd.append('%s:%d: %s' % (f, i, line.rstrip()))
                  if line.lstrip().startswith('#'):
                      continue
                  for m in pat.finditer(line):
                      bad.append('%s:%d: %s' % (f, i, m.group(0)))
          if fffd:
              print('::error::文件里有编码坏掉的字符（U+FFFD）：')
              print('\n'.join(fffd))
              sys.exit(1)
          if bad:
              print('::error::变量名后面直接跟了中文标点（bash 会把标点吃进变量名）：')
              print('\n'.join(bad))
              sys.exit(1)
          print('OK   全仓 shell 文件：变量名后面没有紧跟中文标点，也没有编码坏字')
          PYGUARD
          echo "OK   两个安装器都不会悄悄跳过：EFI 登记失败即失败、写盘校验用目标侧证据"

      - name: Assert QM1 hardware driver & firmware coverage
        run: |
          set -eu
          ROOT=build/rootfs
          rc=0
          # 驱动清单由 install-drivers.sh 在 chroot 内生成，这里先取出来再断言
          cp "$ROOT/usr/local/share/qm1/driver-manifest.txt" build/out/driver-manifest.txt

          # 1) 启动关键驱动必须存在于本镜像内核（module 或 builtin 都算有）
          for m in $QM1_CRITICAL_MODULES; do
            if grep -qE "^${m}[[:space:]]+(module|builtin)([[:space:]]|$)" build/out/driver-manifest.txt; then
              echo "OK   关键驱动 $m"
            else
              echo "::error::启动关键驱动缺失：${m}（QM1 会认不到 eMMC/ESP，插电起不来）"
              rc=1
            fi
          done

          # 2) initramfs 里必须真的塞进了这些模块
          #    注意模块文件名里 MMC 用下划线（mmc_block.ko），其余用连字符，
          #    所以两种写法都要匹配。
          #
          #    坑：initrd.img 可能是「early cpio（Intel 微码）+ zstd 主归档」的拼接格式，
          #    直接 `zstd -dc` 会因为前缀不是 zstd 帧而解不出内容（grep 必然找不到）。
          #    所以改用 initramfs-tools 的 lsinitramfs 列举，它认识所有这些格式。
          initrd="$(ls "$ROOT"/boot/initrd.img-* 2>/dev/null | head -1 || true)"
          if [ -z "$initrd" ]; then
            echo "::error::镜像里没有 initrd.img-*"; rc=1
          else
            echo "initramfs: $initrd"
            listing="$(lsinitramfs "$initrd" 2>/dev/null || true)"
            if [ -z "$listing" ]; then
              echo "::warning::lsinitramfs 列举失败，回退到 unmkinitramfs"
              tmpd="$(mktemp -d)"
              unmkinitramfs "$initrd" "$tmpd" 2>/dev/null || true
              listing="$(find "$tmpd" -type f -printf '%p\n' 2>/dev/null || true)"
              rm -rf "$tmpd"
            fi
            printf '%s\n' "$listing" > build/out/initramfs-listing.txt
            echo "initramfs 条目数：$(printf '%s\n' "$listing" | grep -c . || true)"
            for m in sdhci[-_]pci sdhci[-_]acpi mmc[-_]block; do
              # herestring 而非管道：GitHub 的 bash 默认带 -o pipefail，
              # 管道里 grep -q 提前退出会让上游收到 SIGPIPE，管道返回 141，
              # 结果是"明明在清单里"却被判成"缺失"。
              if grep -aqE "$m" <<<"$listing"; then
                echo "OK   initramfs 含 $m"
              else
                echo "::error::initramfs 里没有 $m —— 根盘/ESP 阶段会挂不上"
                printf '%s\n' "$listing" | grep -aE 'sdhci|mmc' | head -10 || true
                rc=1
              fi
            done
          fi

          # 3) 非关键硬件驱动（缺失只告警，但必须写进清单）
          for m in $QM1_OPTIONAL_MODULES; do
            if grep -qE "^${m}[[:space:]]+(module|builtin)([[:space:]]|$)" build/out/driver-manifest.txt; then
              echo "OK   硬件驱动 $m"
            else
              echo "::warning::硬件驱动缺失：${m}（不影响启动，但对应外设不可用）"
            fi
          done

          # 3b) 编译进内核的驱动：用内核 config 核对（没有 .ko，不能 modinfo）
          kcfg="$(ls "$ROOT"/boot/config-* 2>/dev/null | head -1 || true)"
          if [ -z "$kcfg" ]; then
            echo "::error::镜像里没有 /boot/config-*（无法核对内置驱动）"; rc=1
          else
            for m in $QM1_BUILTIN_MODULES; do
              # 内核 config 符号名与模块名不一定一致（6.12: rtc_cmos → RTC_DRV_CMOS）
              case "$m" in
                rtc_cmos) sym="CONFIG_RTC_DRV_CMOS" ;;
                *) sym="CONFIG_$(echo "$m" | tr 'a-z-' 'A-Z_')" ;;
              esac
              if grep -qE "^${sym}=y$" "$kcfg"; then
                echo "OK   内置驱动 ${m}（$sym=y）"
              else
                echo "::warning::内置驱动未确认：${m}（$sym 不是 y）"
              fi
            done
          fi

          # 4) firmware 包必须装进镜像
          for p in $QM1_REQUIRED_FIRMWARE; do
            pkg_status="$(chroot "$ROOT" dpkg-query -W -f='${Status}' "$p" 2>/dev/null || true)"
            if [ "$pkg_status" = "install ok installed" ]; then
              echo "OK   firmware 包 $p"
            else
              echo "::error::firmware 包未装进镜像：$p"
              rc=1
            fi
          done

          # 5) 汇总固件 blob 落盘情况（无线芯片型号待上机确认，这里只报事实）
          echo "--- firmware blob ---"
          sed -n '/firmware blob/,$p' build/out/driver-manifest.txt | tee -a build/out/firmware-blobs.txt

          exit $rc

      - name: Verify ext4 image contents (debugfs, no mount)
        run: |
          bash scripts/verify-image.sh build/out/rootfs.img

      - name: Driver manifest review
        run: |
          set -eux
          cat build/rootfs/usr/local/share/qm1/driver-manifest.txt | tee build/out/driver-manifest.txt
          # 清单状态取值：module / builtin / absent
          if grep -qE '[[:space:]]absent([[:space:]]|$)' build/out/driver-manifest.txt; then
            echo "::warning::驱动清单中有 absent 项（多为需 DKMS 的 Realtek 芯片，属预期）"
            grep -E '[[:space:]]absent([[:space:]]|$)' build/out/driver-manifest.txt || true
          fi

      - name: Package inventory
        run: |
          cp build/rootfs-manifest.txt build/out/rootfs-manifest.txt 2>/dev/null || true
          cp build/rootfs.mmdebstrap.log build/out/mmdebstrap.log 2>/dev/null || true
          du -sh build/rootfs | tee build/out/rootfs-size.txt

      - name: Assemble installable disk image
        run: |
          set -eux
          bash scripts/assemble-disk.sh \
            --esp build/out/esp.img \
            --root build/out/rootfs.img \
            --out build/out/qm1-disk.img \
            --size-gib "${{ inputs.disk_size_gib || 30 }}"
          cp scripts/install-qm1.sh build/out/
          # 整盘镜像很大，压缩后再上传
          # -19 在 6.25GiB 镜像上要跑 ~9.5 分钟，-12 明显更快而体积只大一点
          zstd -12 -T0 --long=27 -f build/out/qm1-disk.img -o build/out/qm1-disk.img.zst
          ls -lh build/out/qm1-disk.img.zst
          sha256sum build/out/qm1-disk.img.zst >> build/out/SHA256SUMS

      - name: Boot the assembled disk image under UEFI (QEMU)
        run: |
          set -eu
          # 出货形态的启动测试：整盘镜像（GPT + ESP + GRUB + 根分区）经 OVMF
          # 走 UEFI 引导，验证的是"刷完这个盘能不能开机"。
          # 上面那次只测了根文件系统那一层（直接 -kernel 起）⇒ ESP 里的引导器、
          # grub.cfg 的 search 行、根 UUID、内核 handover 这一整段没人验过。
          # GRUB 菜单有 5 秒超时，会自动选第 ① 项（正常启动那条）⇒ 不需要交互。
          # 这个作业跑在容器里（debian:trixie-slim），容器内是 root、
          # 而且**没有 sudo 这个命令** ⇒ 这里不能写 sudo（写了自己就报
          # "sudo: command not found"，exit 127，整个步骤挂掉）。
          # 同一作业里其它安装步骤都是直接 apt-get，就是这个原因。
          apt-get update -qq
          # ★ ovmf-ia32 也要装：这台机器的固件是 32 位 IA32（加载不了 PE32+
          #   的 BOOTX64.EFI），而 32 位那套 OVMF 在**另一个包**里。
          #   只装 ovmf 的话脚本只能退到 x64 固件，等于没测到真机那一侧。
          apt-get install -y --no-install-recommends ovmf ovmf-ia32
          rc=0
          bash scripts/boot-smoke.sh \
            --disk build/out/qm1-disk.img \
            --timeout 420 \
            --log build/out/boot-disk-smoke.log || rc=$?
          if [ "$rc" = "77" ]; then
            # ★ 跳过**不算通过**。这一条是出货形态唯一的自动验证：
            #   "刷完这个盘能不能开机"全靠它。以前这里是一条 warning，
            #   于是这个测试从头到尾一次都没真跑过（脚本按老文件名找 OVMF，
            #   Debian trixie 早就换成 4M 布局的文件名了 ⇒ 永远找不到）。
            #   只有显式说"我知道我在跳过"（QM1_ALLOW_BOOT_SKIP=1）才放行。
            if [ "${QM1_ALLOW_BOOT_SKIP:-0}" = "1" ]; then
              echo "::warning::整盘镜像的 UEFI 启动测试被显式跳过（QM1_ALLOW_BOOT_SKIP=1）"
            else
              echo "::error::整盘镜像的 UEFI 启动测试被跳过（找不到 OVMF 固件）—— 这是出货形态唯一的自动验证，不许静默跳过"
              exit 1
            fi
          elif [ "$rc" != "0" ]; then
            tail -40 build/out/boot-disk-smoke.log || true
            exit "$rc"
          fi

      - name: Boot the assembled disk image under 32-bit UEFI (QEMU)
        run: |
          set -eu
          # ★ 这一条测的是**真机走的那条路**。
          #
          # 上面那次用的是 x86_64 的 OVMF ⇒ 固件加载 \EFI\BOOT\BOOTX64.EFI
          # ⇒ grubx64 ⇒ amd64 内核。可这台机器（Z3735F，Bay Trail-T）的
          # 固件是 **32 位 IA32 UEFI**，它加载不了 PE32+ 的 BOOTX64.EFI，
          # 只会去加载 \EFI\BOOT\BOOTIA32.EFI ⇒ grub2ia32 ⇒ 再去带 amd64 内核。
          #
          # 也就是说：出货形态真正要走的那条引导链（32 位固件 → IA32 的 GRUB
          # → 64 位内核），在 CI 里从来没被验过 —— 跟上一轮 OVMF 文件名那次
          # 一模一样的盲区，只是藏得更深（那次至少有个 SKIP 提示，这次连
          # 提示都没有，因为我们压根没起过 IA32 固件）。
          #
          # 32 位固件能不能带 64 位内核，是个真问题：Debian 的内核是
          # PE32+ 的 EFI-stub 映像，32 位 UEFI 的 LoadImage 按规范只认 PE32。
          # GRUB 有没有绕过去的办法，只有真起一次才知道。
          # 所以这里必须真跑，不许跳过 —— 跑挂就是真缺陷，得改出货形态。
          apt-get update -qq
          apt-get install -y --no-install-recommends ovmf ovmf-ia32
          rc=0
          QM1_OVMF_CODE=/usr/share/OVMF/OVMF32_CODE_4M.fd \
          QM1_OVMF_VARS=/usr/share/OVMF/OVMF32_VARS_4M.fd \
          bash scripts/boot-smoke.sh \
            --disk build/out/qm1-disk.img \
            --timeout 420 \
            --log build/out/boot-disk-smoke-ia32.log || rc=$?
          if [ "$rc" = "77" ]; then
            if [ "${QM1_ALLOW_BOOT_SKIP:-0}" = "1" ]; then
              echo "::warning::32 位 UEFI 下的整盘启动测试被显式跳过（QM1_ALLOW_BOOT_SKIP=1）"
            else
              echo "::error::32 位 UEFI 下的整盘启动测试被跳过（找不到 IA32 的 OVMF 固件）—— 真机走的就是这条路，不许静默跳过"
              exit 1
            fi
          elif [ "$rc" != "0" ]; then
            tail -60 build/out/boot-disk-smoke-ia32.log || true
            exit "$rc"
          fi

      - name: Boot the installer media (QEMU)
        run: |
          set -eu
          # ★ 安装介质（写进 U 盘、开机选"② 安装到 eMMC"的那个盘）从来没被启动过。
          #   它用的是**另一份 grub.cfg**（scripts/grub-installer.cfg.example），
          #   里面有**三处占位符替换**：
          #     ① search --label @ESP_LABEL@    ESP 的卷标
          #     ② root=UUID=@ROOT_UUID@         根分区 UUID
          #     ③ /vmlinuz 与 /initrd.img 的路径
          #   替换错了，用户插上 U 盘就是黑屏 —— 而 CI 全绿：
          #   下面那个"安装介质是自包含的"步骤只静态检查了菜单里
          #   "有没有那些字符串"，从来没让这块盘真的引导过一次。
          #
          # 这里真起一次。安全：安装菜单的默认项是"① 试用系统"，
          # 不带 qm1.install=1 ⇒ qm1-install.service 的
          # ConditionKernelCommandLine=qm1.install=1 不成立 ⇒
          # 不会触发安装、不写盘。
          rc=0
          bash scripts/boot-smoke.sh \
            --disk build/out/qm1-installer.img \
            --timeout 420 \
            --log build/out/boot-installer-smoke.log || rc=$?
          if [ "$rc" = "77" ]; then
            echo "::error::安装介质的启动测试被跳过（找不到 OVMF 固件）—— 这一步是出货的第一步，不许静默跳过"
            exit 1
          elif [ "$rc" != "0" ]; then
            tail -60 build/out/boot-installer-smoke.log || true
            exit "$rc"
          fi
          bash scripts/boot-smoke-assert.sh \
            --console build/out/boot-smoke/console.log --require-trial-boot

      - name: Boot the installer media under 32-bit UEFI (QEMU)
        run: |
          set -eu
          QM1_OVMF_CODE=/usr/share/OVMF/OVMF32_CODE_4M.fd \
          QM1_OVMF_VARS=/usr/share/OVMF/OVMF32_VARS_4M.fd \
          bash scripts/boot-smoke.sh \
            --disk build/out/qm1-installer.img \
            --timeout 420 \
            --log build/out/boot-installer-smoke-ia32.log
          bash scripts/boot-smoke-assert.sh \
            --console build/out/boot-smoke/console.log --require-trial-boot

      - name: Assert the installer image is self-contained
        run: |
          set -eu
          # 安装介质 = 同一套内核/根文件系统 + 换了菜单的 ESP。
          # 写进 U 盘开机后，选第 ① 项就能把系统装到 eMMC。
          ROOT=build/rootfs
          [ -f build/out/qm1-installer.img ] || { echo "::error::没生成安装介质镜像"; exit 1; }
          # 1) 根文件系统里要有安装脚本与单元
          [ -x "$ROOT/usr/local/sbin/qm1-install-to-emmc" ] \
            || { echo "::error::镜像里没有 qm1-install-to-emmc"; exit 1; }
          [ -f "$ROOT/etc/systemd/system/qm1-install.service" ] \
            || { echo "::error::镜像里没有 qm1-install.service"; exit 1; }
          [ -L "$ROOT/etc/systemd/system/multi-user.target.wants/qm1-install.service" ] \
            || { echo "::error::安装单元没有开机自启（缺 multi-user.target.wants 链接）"; exit 1; }
          # 2) 安装介质 ESP 里要有：安装菜单 + 正常菜单（装完由脚本拷回目标 ESP）
          mdir -/ -i build/out/esp-installer.img ::/EFI/BOOT | tee build/out/esp-installer-listing.txt
          for f in BOOTIA32 BOOTX64 grub ; do
            grep -q "$f" build/out/esp-installer-listing.txt \
              || { echo "::error::安装介质 ESP 缺少 $f"; exit 1; }
          done
          grep -qi 'grub-normal' build/out/esp-installer-listing.txt \
            || { echo "::error::安装介质 ESP 缺少 grub-normal.cfg（装完无法换回正常菜单）"; exit 1; }
          # 3) 安装菜单里得有"安装到 eMMC"那一项，且带 qm1.install=1
          mcopy -i build/out/esp-installer.img ::/EFI/BOOT/grub.cfg build/out/installer-grub.cfg
          grep -q 'qm1.install=1' build/out/installer-grub.cfg \
            || { echo "::error::安装菜单缺少 qm1.install=1（安装动作不会触发）"; exit 1; }
          # 非 TTY 环境（systemd 单元）里，"确认覆盖 eMMC"这步必须有 yes，
          # 否则安装器会停在那一步 —— 从菜单选 ① 永远走不完。
          grep -q 'qm1.install.mode=emmc' build/out/installer-grub.cfg \
            || { echo "::error::安装菜单缺少 qm1.install.mode=emmc（目标不明确）"; exit 1; }
          grep -q 'qm1.install.yes=1' build/out/installer-grub.cfg \
            || { echo "::error::安装菜单缺少 qm1.install.yes=1（非交互下会停在确认步骤）"; exit 1; }
          # 安全：安装菜单的**第一条（默认项）必须是不写盘的那条**。
          # 原来默认项就是"安装到 eMMC" + timeout=8 ⇒ 插上 U 盘什么都不选，
          # 8 秒后就开始擦 eMMC，没有任何二次确认。
          FIRST_LINUX="$(awk '
            /^menuentry / { if (!seen) { seen = 1 } ; next }
            seen && /^[[:space:]]*linux[[:space:]]/ { print; exit }
          ' build/out/installer-grub.cfg)"
          case "$FIRST_LINUX" in
            *qm1.install=1*)
              echo "::error::安装菜单的第一条（默认项）带 qm1.install=1 —— 插上 U 盘就会自动擦 eMMC"; exit 1 ;;
          esac
          grep -q 'qm1.install.backup_dir' build/out/installer-grub.cfg \
            || { echo "::error::安装菜单没有讲怎么给备份目录（qm1.install.backup_dir）"; exit 1; }
          # 4) 设备端要能分区：sfdisk 来自 fdisk 包；要登记 UEFI 启动项：efibootmgr
          [ -x "$ROOT/usr/sbin/sfdisk" ] || [ -x "$ROOT/usr/bin/sfdisk" ] \
            || { echo "::error::镜像里没有 sfdisk（设备上无法给 eMMC 分区）"; exit 1; }
          { [ -x "$ROOT/usr/sbin/efibootmgr" ] || [ -x "$ROOT/usr/bin/efibootmgr" ]; } \
            || { echo "::error::镜像里没有 efibootmgr（装完无法登记 UEFI 启动项）"; exit 1; }
          # ★ 静态守卫：设备侧安装器的三个要害
          #   1) 尾部备份的 dd 必须按**字节**偏移（oflag=seek_bytes）。
          #      原来写 seek=$((BASE/1048576)) 配 bs=4M ⇒ 实际落到 4×BASE，
          #      备份写错位置 ⇒ 按正确偏移读回校验必然不一致 ⇒ 真机安装永远走不完。
          #   2) 必须有 qm1.install.backup_dir —— 菜单①所在的安装介质放不下 28.5GiB，
          #      没有这个通道就只剩"手敲命令"一条路。
          #   3) 必须有 --force-kind —— 否则设备侧 mode=emmc 分支在 CI 里零覆盖，
          #      而 P0 恰好藏在那条分支里。
          INSTALLER="$ROOT/usr/local/sbin/qm1-install-to-emmc"
          [ -f "$INSTALLER" ] \
            || { echo "::error::镜像里没有 qm1-install-to-emmc"; exit 1; }
          grep -q 'oflag=seek_bytes' "$INSTALLER" \
            || { echo "::error::尾部备份的 dd 没有按字节偏移（缺 oflag=seek_bytes）"; exit 1; }
          grep -q 'qm1.install.backup_dir' "$INSTALLER" \
            || { echo "::error::安装器没有 qm1.install.backup_dir（真机没法给备份位置）"; exit 1; }
          grep -q -- '--force-kind' "$INSTALLER" \
            || { echo "::error::安装器没有 --force-kind（mode=emmc 分支没法进 CI）"; exit 1; }
          echo "OK   安装介质（安装菜单 + 正常菜单 + 安装脚本 + sfdisk + efibootmgr）齐备"
          zstd -12 -T0 --long=27 -f build/out/qm1-installer.img -o build/out/qm1-installer.img.zst
          ls -lh build/out/qm1-installer.img.zst
          sha256sum build/out/qm1-installer.img.zst >> build/out/SHA256SUMS

      - name: Assert the provisioning injection works (no secrets needed)
        run: |
          set -eu
          # 出厂镜像里**不该**带 Wi-Fi 凭据（公开仓库 + CI 日志都不能有密钥），
          # 但「装进 eMMC、开机即用」要求介质上有 /qm1/provision/。
          # 交付流程因此是：prepare-provision.sh 生成目录 → inject-provision.sh
          # 注入已构建好的介质 → 再 dd 到 U 盘。
          # 这里用占位凭据验证**注入脚本本身可用**（不回读真实密钥）。
          PROV="$(mktemp -d)"
          cat > "$PROV/wpa_supplicant.conf" <<'EOF'
          country=CN
          ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev
          update_config=1
          network={
              ssid="qm1-ci-placeholder"
              psk="qm1-ci-placeholder-psk"
              key_mgmt=WPA-PSK
          }
          EOF
          : > "$PROV/ssh"
          printf 'qm1\n' > "$PROV/ssh_user"
          # a) 裸 ESP 镜像（make-esp.sh 的产物）
          cp build/out/esp-installer.img build/out/esp-installer.provisioned.img
          bash scripts/inject-provision.sh \
            --image build/out/esp-installer.provisioned.img --dir "$PROV" --esp-only
          mdir -/ -i build/out/esp-installer.provisioned.img ::/qm1/provision \
            | tee build/out/prov-listing.txt
          for f in wpa_supplicant.conf ssh ssh_user; do
            grep -q "$f" build/out/prov-listing.txt \
              || { echo "::error::注入后 ESP 里没有 ${f}（/qm1/provision/ 不完整）"; exit 1; }
          done
          # b) 整盘镜像：脚本要能自己认出 GPT 里的 ESP 分区并写进去
          cp build/out/qm1-installer.img build/out/qm1-installer.provisioned.img
          bash scripts/inject-provision.sh \
            --image build/out/qm1-installer.provisioned.img --dir "$PROV"
          # c) 出厂产物本身必须**不含**占位凭据（注入只发生在副本上）
          mdir -/ -i build/out/esp-installer.img ::/qm1 2>/dev/null \
            && { echo "::error::出厂 ESP 里出现了 /qm1 —— 凭据不该进产物"; exit 1; } || true
          rm -f build/out/esp-installer.provisioned.img build/out/qm1-installer.provisioned.img
          rm -rf "$PROV"
          echo "OK   provisioning 注入可用（裸 ESP 与整盘镜像两条路径都通过）"

      - name: Assert the system base contains no application payload
        run: |
          set -eu
          ROOT=build/rootfs
          for p in /usr/bin/chromium /usr/bin/google-chrome /opt/qm1/python \
                   /usr/local/share/qm1/provision-agent.sh \
                   /usr/local/sbin/qm1-provision \
                   /etc/systemd/system/qm1-provision.service \
                   /etc/systemd/system/qm1-provision.timer; do
            if [ -e "$ROOT$p" ] || [ -L "$ROOT$p" ]; then
              echo "::error::系统镜像不应包含应用预装或自动部署：$p"; exit 1
            fi
          done
          if chroot "$ROOT" dpkg-query -W -f='${binary:Package} ${db:Status-Status}\n' \
              | grep -E '^(chromium|chromium-driver|google-chrome[^ ]*) installed$'; then
            echo "::error::系统镜像包含浏览器包"; exit 1
          fi
          echo "OK   系统底座不预装应用，也不在首启时下载应用"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qm1-build-log
          path: |
            build/rootfs.mmdebstrap.log
            build/out/manifest.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload metadata artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qm1-image-metadata-${{ inputs.arch || 'amd64' }}-${{ inputs.profile || 'base' }}
          path: |
            build/out/manifest.txt
            build/out/driver-manifest.txt
            build/out/esp-listing.txt
            build/out/esp-installer-listing.txt
            build/out/installer-grub.cfg
            build/out/rootfs-manifest.txt
            build/out/rootfs-size.txt
            build/out/bootloaders/

      - name: Upload image artifacts (opt-in)
        if: inputs.upload_images == true
        uses: actions/upload-artifact@v4
        with:
          name: qm1-images-${{ inputs.arch || 'amd64' }}
          # 只传压缩包与清单，不传未压缩的整盘镜像（6 GiB 级的 .img 上传极慢）
          path: |
            build/out/qm1-disk.img.zst
            build/out/qm1-installer.img.zst
            build/out/SHA256SUMS
            build/out/manifest.txt
            build/out/install-qm1.sh
          compression-level: 6
          retention-days: 7
