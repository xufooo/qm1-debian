name: build-image

# ============================================================================
# QM1 (ASUS QM1-B002 / Intel Atom Z3735F / Bay Trail) 硬件 → 驱动与固件 对应表
#
# 一、内核自带（in-tree，无额外驱动包）
#   硬件              模块                     用途 / 备注
#   eMMC/SD 控制器     sdhci_pci / sdhci_acpi   两条枚举路径（PCI / ACPI），必有其一生效；
#                                               上游依据：mmc: sdhci-pci: fix eMMC controller
#                                               issue on Intel Baytrail SoCs (Kurt Kanzenbach, 2018)
#                                               mmc: sdhci-acpi: Add some DMI quirks ... Bay Trail
#                                               (Hans de Goede, 2024, spinics msg80147)
#                                               commit 6e1c7d6103fe sdhci-acpi: Reduce Baytrail hangs
#   根盘/ESP          mmc_block / vfat / ext4  vfat=ESP, ext4=根文件系统
#   USB 2.0 / 3.0     ehci_pci / xhci_hcd       microSD 读卡器、U 盘、USB 网卡
#   显卡              i915                     Intel HD Graphics Gen7
#   声卡              snd_hda_intel            + snd_hda_codec_realtek
#   蓝牙              btusb                    Intel 无线模组的蓝牙部分
#   RTC / 电源         rtc_cmos / intel_idle / acpi_cpufreq / intel_powerclamp
#
# 二、只读固件 blob（需要 firmware 包，Debian 13 在 non-free-firmware 组件）
#   firmware-linux-free      main：常用 blob
#   firmware-brcm80211       Broadcom brcmfmac（BCM4352/4356/4365/4366/4366b…）
#   firmware-realtek         Realtek 8723*/8812* 家族 blob
#   firmware-atheros         Qualcomm Atheros
#   firmware-iwlwifi         Intel 无线
#   intel-microcode          平台微码（i915 等）
#
# 三、需 out-of-tree（DKMS，主线无驱动）
#   Realtek RTL8723AU / RTL8812AU / RTL8812BU —— QM1 具体无线芯片型号尚未确认，
#   构建期不内置源码；如识别为上述型号，需对同一内核版本编译 DKMS 后重装，
#   或改用 USB 以太网适配器兜底（见 hooks/customize02-drivers.sh 的 QM1_DKMS_DEB_DIR）。
#
# 内核配置事实（Debian 13 的 linux-image-6.12.x+deb13-amd64 实测 config）：
#   CONFIG_MMC_SDHCI=m / CONFIG_MMC_SDHCI_PCI=m / CONFIG_MMC_SDHCI_ACPI=m
#   CONFIG_MMC_BLOCK=m / CONFIG_VFAT_FS=m / CONFIG_EXT4_FS=m
#   CONFIG_DRM_I915=m / CONFIG_SND_HDA_INTEL=m / CONFIG_SND_HDA_CODEC_REALTEK=m
#   CONFIG_USB_EHCI_PCI=m / CONFIG_USB_XHCI_HCD=m / CONFIG_USB_STORAGE=m
#   CONFIG_BT_HCIBTUSB=m / CONFIG_BRCMFMAC=m / CONFIG_IWLWIFI=m / CONFIG_RTW88=m
#   编进内核（=y，无 .ko）：CONFIG_ACPI=y CONFIG_INTEL_IDLE=y CONFIG_THERMAL=y
#                            CONFIG_RTC_DRV_CMOS=y（rtc_cmos 的符号名）
#   注意：CONFIG_ACPI_CPUFREQ 不存在 → 这颗 Atom 没有 cpufreq 缩放驱动，属正常。
#
# 发行版选择（重要）：
#   Debian 13 (trixie) 不再提供 i386 内核包（binary-i386 无 linux-image-*），
#   也没有 i386 安装器 → 32 位变体只能用 Debian 12 (bookworm) 的
#   linux-image-686-pae（PAE，适配这颗 Bay Trail）。
#   64 位主线：Debian 13 (trixie) amd64。
#
# 判定策略：上面第一类（启动关键路径）缺一即构建失败；第二、三类缺失只告警并写进清单。
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "目标架构（本项目只做 64 位系统；32 位 EFI 引导器仍然保留）"
        type: choice
        options: [amd64]
        default: amd64
      profile:
        description: "base = 最小可运行；runtime = 追加 Chromium 等 agent 运行时依赖"
        type: choice
        options: [base, runtime]
        default: runtime
      disk_size_gib:
        description: "整机镜像大小（GiB），应略小于 eMMC 容量（32GB eMMC 建议 30）"
        type: string
        default: "30"
      upload_images:
        description: "是否上传镜像产物（体积大，分钟级）"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "hooks/**"
      - "overlay/**"
      # 树外模块的本地补丁（patches/rtw88/）直接进到镜像里的 rtw88 模块，
      # 只改补丁不改脚本时也必须重建镜像。
      - "patches/**"
      - ".github/workflows/build-image.yml"
  schedule:
    # 每周一 03:00 UTC —— 验证 Debian 仓库侧变化没有把构建打断
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 容器作业里 GitHub 默认用 sh（dash），不支持 <(...) 进程替换等 bash 语法 →
    # 显式声明 bash，脚本与校验步骤才能一致
    defaults:
      run:
        shell: bash
    # debootstrap 需要在 chroot 里挂载 /proc /dev /sys → 容器必须 privileged
    container:
      image: debian:trixie-slim
      options: --privileged
    env:
      # 目标架构：workflow_dispatch 时取输入，push/schedule 时默认 amd64
      QM1_TARGET_ARCH: ${{ inputs.arch || 'amd64' }}
      # 固定内核 point release：Debian 13 元包当前给的是 6.12.107-1，
      # 而 rtl8723bs 的 2026 安全修复（kfree_sensitive、WMM IE 长度校验、
      # WPA IE 越界读、监控帧长度校验）从 6.12.111 才回移进 6.12.y。
      # 钉死后由 hooks/customize02-drivers.sh 从 trixie-proposed-updates 精确安装，
      # 装不上直接失败，不静默回退到元包。
      QM1_KERNEL_VERSION: 6.12.113
      QM1_KERNEL_ABI: 6.12.113+deb13-amd64
      # 启动关键路径：缺任一项都意味着 QM1 认不到 eMMC/ESP，插电起不来 → CI 必须失败
      # 名称与驱动清单（driver-manifest.txt）里的模块名一致（连字符形式）
      QM1_CRITICAL_MODULES: sdhci-pci sdhci-acpi mmc_block vfat ext4
      # 硬件相关的非关键驱动：缺失只告警（写进 driver-manifest.txt）
      QM1_OPTIONAL_MODULES: i915 snd-hda-intel snd-hda-codec-realtek btusb ehci-pci xhci-hcd usb-storage usbnet r8152 asix brcmfmac iwlwifi rtw88
      # 编译进内核（=y，没有 .ko）的驱动：只能核对内核 config，不能用 modinfo
      QM1_BUILTIN_MODULES: acpi intel_idle thermal rtc_cmos
      # 必须装进镜像的 firmware 包（non-free-firmware 组件）
      QM1_REQUIRED_FIRMWARE: firmware-linux-free firmware-brcm80211 firmware-realtek firmware-atheros firmware-iwlwifi
    steps:
      - uses: actions/checkout@v4

      # runner 磁盘默认只有 ~14G 可用，mmdebstrap + 解包 + ext4 镜像会吃满
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install build dependencies
        run: |
          set -eux
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            mmdebstrap debian-archive-keyring mtools dosfstools e2fsprogs fdisk util-linux \
            grub2-common file ca-certificates curl wget gnupg gpgv xz-utils zstd procps kmod \
            initramfs-tools cpio
          # 两个架构的 EFI 模块：grub-mkimage 与 .mod 必须同版本，
          # 所以直接用 trixie 仓库里的同一套 grub2-common + grub-efi-*-bin
          dpkg --add-architecture i386
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            grub-efi-ia32-bin:i386 grub-efi-amd64-bin:amd64

      - name: Install pinned kernel headers (for the patched Wi-Fi module)
        if: env.QM1_TARGET_ARCH == 'amd64'
        run: |
          set -eux
          # 6.12.113 还在 trixie-proposed-updates 里（主仓库当前是 6.12.107-1）
          echo 'deb http://deb.debian.org/debian trixie-proposed-updates main' \
            > /etc/apt/sources.list.d/qm1-proposed.list
          apt-get update -qq
          # 头文件 + 内核本体：装 -unsigned 变体，避免拉 grub-efi-amd64-signed
          #（会跟本项目自带的 BOOTIA32/BOOTX64 双引导器抢 EFI 目录）
          apt-get install -y -qq --no-install-recommends \
            "linux-headers-${QM1_KERNEL_ABI}" \
            "linux-image-${QM1_KERNEL_ABI}-unsigned" \
            build-essential patch kmod dpkg curl git ca-certificates
          test -d "/lib/modules/${QM1_KERNEL_ABI}/build"

      - name: Build patched RTL8723BS module (r8723bs_qm1)
        if: env.QM1_TARGET_ARCH == 'amd64'
        run: |
          set -eux
          # 模块的 vermagic 写死了目标内核版本，必须与镜像里的内核完全一致
          bash scripts/build-rtl8723bs-module.sh --kver "${QM1_KERNEL_ABI}"
          ls -l build/wifi-module/

      - name: Build rtw88 RTL8723BS module (upstream backport)
        if: env.QM1_TARGET_ARCH == 'amd64'
        run: |
          # 上游把 RTL8723B/BS 并进 rtw88 之后，还没有发行版内核带着它
          # （sid 内核 7.2 < 7.4），所以按镜像内核回移成树外模块。
          # 构建失败不阻断流水线：回退到打了补丁的 staging 模块。
          # 优先用上游整树回移的模块（上游真正的 RTL8723B/BS 支持）。
          if bash scripts/build-rtw88-8723bs-module.sh \
               --kver "${QM1_KERNEL_ABI}" \
               --out-dir build/rtw88-module \
               --source upstream-full; then
            # 注意：GITHUB_ENV 的变量名不能带短横线 —— bash 的 ${name-word} 会把
            # "rtw88-module" 当成 "${rtw88}" 再跟字面量 "-module"，展开结果永远
            # 不等于 "ok"，根治模块会被静默丢掉、镜像里只剩会永久卡死的 staging
            # 驱动。所以这里用下划线命名。
            echo "RTW88_MODULE=ok" >> "$GITHUB_ENV"
            ls -l build/rtw88-module/
          else
            echo "::warning::rtw88 回移模块构建失败，回退到打了补丁的 staging 模块"
            echo "RTW88_MODULE=fallback" >> "$GITHUB_ENV"
          fi

      - name: Build the Bluetooth vendor package (rtk_hciattach)
        if: env.QM1_TARGET_ARCH == 'amd64'
        run: |
          set -eux
          # 内置蓝牙是 ACPI 枚举的 UART（OBDA8723/OBDA0623），主线没有 Realtek
          # UART HCI 驱动，要靠用户态 rtk_hciattach 下发厂商固件。
          # 这一步不需要内核头文件，几秒钟就完。
          bash scripts/build-bt-hciattach.sh --out-dir build/bt-hciattach
          ls -l build/bt-hciattach/

      - name: Build root filesystem (mmdebstrap + hooks)
        run: |
          set -eux
          ARCH="${{ inputs.arch || 'amd64' }}"
          EXTRA=()
          if [ "$ARCH" = "amd64" ]; then
            # 钉死内核 point release（6.12.113），并装上 Wi-Fi 驱动
            EXTRA+=(--kernel-version "${QM1_KERNEL_VERSION}")
            if [ "${RTW88_MODULE:-fallback}" = "ok" ]; then
              EXTRA+=(--rtw88-module-deb "$(ls build/rtw88-module/*.deb | head -1)")
            else
              EXTRA+=(--wifi-module-deb "$(ls build/wifi-module/*.deb | head -1)")
            fi
            EXTRA+=(--bt-hciattach-deb "$(ls build/bt-hciattach/*.deb | head -1)")
          fi
          bash scripts/build-rootfs.sh \
            --out build/rootfs \
            --arch "$ARCH" \
            --profile "${{ inputs.profile || 'runtime' }}" \
            ${EXTRA[@]+"${EXTRA[@]}"}

      - name: Build image artifacts (ESP + rootfs + manifest)
        run: |
          bash scripts/build-image.sh \
            --rootfs build/rootfs \
            --out-dir build/out \
            --arch "${{ inputs.arch || 'amd64' }}" \
            --profile "${{ inputs.profile || 'runtime' }}" \
            --installer \
            --disk-size-gib "${{ inputs.disk_size_gib || 30 }}"

      - name: Verify artifacts
        run: |
          set -eux
          cat build/out/manifest.txt
          # 校验清单里的 sha256（不依赖 bash 进程替换，sh 下也能跑）
          sed -n '/^--- sha256 ---$/,$p' build/out/manifest.txt | tail -n +2 > build/out/SHA256SUMS
          ( cd build/out && sha256sum -c SHA256SUMS )
          file build/out/bootloaders/grub2ia32.efi build/out/bootloaders/grubx64.efi
          mdir -/ -i build/out/esp.img ::/EFI/BOOT | tee build/out/esp-listing.txt
          mdir -/ -i build/out/esp.img ::/ | tee -a build/out/esp-listing.txt
          # mdir 按 8.3 短名显示（"BOOTIA32 EFI"、"grub     cfg"，点号被显示成空格），
          # 所以按文件名主干断言，不按带点号的完整名。
          for f in BOOTIA32 BOOTX64 grub ; do
            grep -q "$f" build/out/esp-listing.txt || { echo "::error::ESP 缺少 $f"; exit 1; }
          done
          grep -q 'vmlinuz' build/out/esp-listing.txt || { echo "::error::ESP 缺少内核"; exit 1; }
          grep -q 'initrd' build/out/esp-listing.txt || { echo "::error::ESP 缺少 initrd"; exit 1; }

      - name: Assert the rtw88 Wi-Fi module is inside the image
        run: |
          set -eu
          ROOT=build/rootfs
          KABI="${QM1_KERNEL_ABI}"
          # 根治模块必须真的进到镜像里。之前的 bug：GITHUB_ENV 里用了带短横线的
          # 变量名（rtw88-module），bash 里 "${rtw88-module:-fallback}" 展开成
          # 字面量 "module:-fallback"，判断永远为假 → 镜像里只剩会永久卡死的
          # staging 驱动，而流水线一路绿灯。这里把这条做成硬断言。
          if [ "${RTW88_MODULE:-fallback}" != "ok" ]; then
            echo "::error::rtw88 根治模块没有构建成功；镜像里只有已知存在永久卡死路径的 staging r8723bs，不能放行"
            exit 1
          fi
          # 两种布局都认：上游整树回移是单模块 rtw88_qm1，vendor 树是
          # rtw_8723bs + rtw_core + rtw_sdio + rtw_8723b。
          KO_DIR="$ROOT/lib/modules/${KABI}/extra/rtw88"
          if [ -f "$KO_DIR/rtw88_qm1.ko" ]; then
            MOD=rtw88_qm1
          elif [ -f "$KO_DIR/rtw_8723bs.ko" ]; then
            MOD=rtw_8723bs
            for f in rtw_core.ko rtw_sdio.ko rtw_8723b.ko; do
              [ -f "$KO_DIR/$f" ] \
                || { echo "::error::镜像里缺少 rtw88 模块 $f"; exit 1; }
            done
          else
            echo "::error::镜像里没有 rtw88 模块（rtw88_qm1.ko / rtw_8723bs.ko）"; exit 1
          fi
          [ -f "$ROOT/lib/firmware/rtw88/rtw8723b_fw.bin" ] \
            || { echo "::error::镜像里没有 rtw88 固件 rtw88/rtw8723b_fw.bin"; exit 1; }
          grep -qx "$MOD" "$ROOT/etc/modules-load.d/qm1-hardware.conf" \
            || { echo "::error::modules-load.d 里没有 $MOD"; exit 1; }
          if grep -qx 'r8723bs' "$ROOT/etc/modules-load.d/qm1-hardware.conf"; then
            echo "::error::modules-load.d 里还留着 staging r8723bs，会和 rtw88 抢 SDIO 设备"
            exit 1
          fi
          grep -q 'blacklist r8723bs' "$ROOT/etc/modprobe.d/qm1-rtw88-8723bs.conf" \
            || { echo "::error::modprobe 配置里没有 blacklist staging 驱动"; exit 1; }
          # modprobe 里的 options 只能写 rtw_core 真实存在的参数，写错参数会让
          # modprobe 直接拒绝加载模块（Invalid argument）。
          for p in disable_lps_deep support_bf debug_mask; do
            grep -q "options $MOD .*$p=" "$ROOT/etc/modprobe.d/qm1-rtw88-8723bs.conf" \
              || { echo "::error::modprobe 配置里缺少 $MOD 参数 $p"; exit 1; }
          done
          echo "OK   rtw88 根治模块、固件与开机加载项全部就位"

      - name: Assert the Bluetooth vendor package is inside the image
        run: |
          set -eu
          ROOT=build/rootfs
          [ -x "$ROOT/usr/sbin/rtk_hciattach" ] \
            || { echo "::error::镜像里没有 /usr/sbin/rtk_hciattach（内置蓝牙无法初始化）"; exit 1; }
          for f in rtlbt_fw rtlbt_config; do
            [ -f "$ROOT/lib/firmware/rtl_bt/$f" ] \
              || { echo "::error::镜像里缺少蓝牙固件 $f"; exit 1; }
          done
          [ -x "$ROOT/usr/local/bin/qm1-bt-attach.sh" ] \
            || { echo "::error::镜像里没有 qm1-bt-attach.sh"; exit 1; }
          [ -f "$ROOT/lib/systemd/system/qm1-bluetooth.service" ] \
            || { echo "::error::镜像里没有 qm1-bluetooth.service"; exit 1; }
          [ -L "$ROOT/etc/systemd/system/multi-user.target.wants/qm1-bluetooth.service" ] \
            || { echo "::error::蓝牙服务没有开机自启（缺 multi-user.target.wants 链接）"; exit 1; }
          # 内核侧必须有 btuart（CONFIG_BT_HCIUART），否则厂商固件下发后没人接手串口。
          # 实测 Debian 13 的 6.12.113+deb13-amd64 是 CONFIG_BT_HCIUART=m（模块 hci_uart.ko，
          # Linux 6.x 里这个模块叫 hci_uart，早期内核才叫 bt_hciuart.ko），
          # 不是编进内核，所以 =y 与 =m 都要接受；=m 时必须能在镜像里找到模块文件。
          KCFG=$(ls "$ROOT"/boot/config-* 2>/dev/null | head -1 || true)
          [ -n "$KCFG" ] || { echo "::error::镜像里没有内核 config 文件，无法确认 CONFIG_BT_HCIUART"; exit 1; }
          if grep -qE '^CONFIG_BT_HCIUART=y$' "$KCFG"; then
            echo "OK   CONFIG_BT_HCIUART=y（编进内核）"
          elif grep -qE '^CONFIG_BT_HCIUART=m$' "$KCFG"; then
            KVER=$(basename "$KCFG" | sed 's/^config-//')
            if find "$ROOT/lib/modules/$KVER" \( -name 'hci_uart.ko*' -o -name 'bt_hciuart.ko*' \) -print -quit | grep -q .; then
              echo "OK   CONFIG_BT_HCIUART=m，hci_uart.ko 在镜像里（随包加载）"
            else
              echo "::error::CONFIG_BT_HCIUART=m 但镜像里没有 hci_uart.ko"; exit 1
            fi
          else
            echo "::error::内核缺少 CONFIG_BT_HCIUART（既不是 y 也不是 m）"; exit 1
          fi
          echo "OK   蓝牙厂商初始化包、固件、服务与开机自启全部就位"

      - name: Assert the kernel config baseline for the Bay Trail quirks
        run: |
          set -eu
          ROOT=build/rootfs
          KCFG=$(ls "$ROOT"/boot/config-* 2>/dev/null | head -1 || true)
          [ -n "$KCFG" ] || { echo "::error::镜像里没有内核 config 文件"; exit 1; }
          # CONFIG_IOSF_MBI=y 是 Bay Trail 的 sdhci-acpi 挂死修复（上游 6e1c7d6103fe）
          # 真正生效的前提 —— 没有它，eMMC/SD 的挂死补丁等于没打。实测 Debian 13
          # 的 6.12.113+deb13-amd64 为 =y。
          grep -qE '^CONFIG_IOSF_MBI=y$' "$KCFG" \
            || { echo "::error::CONFIG_IOSF_MBI 不是 y —— Bay Trail 的 sdhci-acpi 挂死修复不会生效"; exit 1; }
          echo "OK   CONFIG_IOSF_MBI=y（Bay Trail eMMC/SD 挂死修复生效前提满足）"
          # 记录其余关键项（不作为失败条件，只作为镜像事实写进产物）
          for sym in CONFIG_X86_INTEL_PSTATE CONFIG_X86_ACPI_CPUFREQ CONFIG_PINCTRL_BAYTRAIL \
                     CONFIG_MMC_SDHCI_ACPI CONFIG_BT_HCIUART CONFIG_X86_ACPI_CPUFREQ; do
            val=$(grep -E "^${sym}=" "$KCFG" | head -1 | cut -d= -f2 || true)
            echo "INFO $sym=${val:-unset}"
          done
          # 内核参数必须带上 C-state 限制（Bay Trail C-state 冻结 bug 受影响名单含 Z3735F）
          grep -q 'intel_idle.max_cstate=1' scripts/grub.cfg.example \
            || { echo "::error::scripts/grub.cfg.example 缺少 intel_idle.max_cstate=1"; exit 1; }
          grep -q 'intel_idle.max_cstate=1' scripts/grub-installer.cfg.example \
            || { echo "::error::scripts/grub-installer.cfg.example 缺少 intel_idle.max_cstate=1"; exit 1; }
          echo "OK   内核参数含 intel_idle.max_cstate=1"

      - name: Assert the health collector is inside the image
        run: |
          set -eu
          ROOT=build/rootfs
          # 稳定性取证采集器：没有周期快照就判断不了"整机卡死 / eMMC 掉卡 / Wi-Fi 断流"
          # 到底发没发生，参数调整就成了盲改。
          [ -x "$ROOT/usr/local/sbin/qm1-health-collect" ] \
            || { echo "::error::镜像里没有 /usr/local/sbin/qm1-health-collect"; exit 1; }
          [ -x "$ROOT/usr/local/bin/qm1-stress" ] \
            || { echo "::error::镜像里没有 /usr/local/bin/qm1-stress"; exit 1; }
          for u in qm1-health-collect.service qm1-health-collect.timer; do
            [ -f "$ROOT/lib/systemd/system/$u" ] || [ -f "$ROOT/etc/systemd/system/$u" ] \
              || { echo "::error::镜像里缺少 systemd 单元 $u"; exit 1; }
          done
          [ -L "$ROOT/etc/systemd/system/timers.target.wants/qm1-health-collect.timer" ] \
            || { echo "::error::qm1-health-collect.timer 没有开机自启（缺 timers.target.wants 链接）"; exit 1; }
          grep -q 'mmc_error_lines=' "$ROOT/usr/local/sbin/qm1-health-collect" \
            || { echo "::error::采集器缺少 eMMC 错误计数（mmc_error_lines）"; exit 1; }
          grep -q 'hung task' "$ROOT/usr/local/sbin/qm1-health-collect" \
            || { echo "::error::采集器缺少挂死类内核抱怨计数"; exit 1; }
          echo "OK   稳定性取证采集器、定时器与压测脚本全部就位"

      - name: Assert the hardware fixups are inside the image
        run: |
          set -eu
          ROOT=build/rootfs
          # 每个功能都要真的能用：eMMC 不自动挂起、CPU 调频、HDMI 音频、蓝牙绑定
          [ -x "$ROOT/usr/local/sbin/qm1-hardware-fixups" ] \
            || { echo "::error::镜像里没有 /usr/local/sbin/qm1-hardware-fixups"; exit 1; }
          [ -f "$ROOT/lib/systemd/system/qm1-hardware-fixups.service" ] \
            || [ -f "$ROOT/etc/systemd/system/qm1-hardware-fixups.service" ] \
            || { echo "::error::镜像里缺少 systemd 单元 qm1-hardware-fixups.service"; exit 1; }
          [ -L "$ROOT/etc/systemd/system/multi-user.target.wants/qm1-hardware-fixups.service" ] \
            || { echo "::error::qm1-hardware-fixups.service 没有开机自启（缺 multi-user.target.wants 链接）"; exit 1; }
          [ -f "$ROOT/etc/default/qm1-hardware" ] \
            || { echo "::error::镜像里缺少 /etc/default/qm1-hardware"; exit 1; }
          for needle in 'power/control' 'scaling_governor' 'snd-hda-codec-hdmi' 'hci_uart'; do
            grep -q "$needle" "$ROOT/usr/local/sbin/qm1-hardware-fixups" \
              || { echo "::error::硬件修正脚本缺少 $needle 相关处理"; exit 1; }
          done
          echo "OK   硬件修正脚本、systemd 单元与自启链接全部就位"

      - name: Assert the time sync and the bluetooth stack are enabled
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/qm1-root"
          for unit in systemd-timesyncd.service bluetooth.service; do
            # systemd-timesyncd 由 timers.target 激活，bluetooth 由 multi-user.target。
            if [ ! -e "$ROOT/etc/systemd/system/timers.target.wants/$unit" ] \
               && [ ! -e "$ROOT/etc/systemd/system/multi-user.target.wants/$unit" ]; then
              echo "::error::$unit 未在镜像里启用"
              exit 1
            fi
          done
          [ -e "$ROOT/etc/systemd/system/bluetooth.service.d/qm1.conf" ] \
            || { echo "::error::缺少 bluetooth.service.d/qm1.conf（蓝牙栈要等厂商固件下发）"; exit 1; }
          grep -q "After=qm1-bluetooth.service" "$ROOT/etc/systemd/system/bluetooth.service.d/qm1.conf" \
            || { echo "::error::bluetooth 单元没有排在 qm1-bluetooth.service 之后"; exit 1; }
          echo "时间同步与蓝牙栈已启用"

      - name: Assert the first-boot provisioning is inside the image
        run: |
          set -eu
          ROOT=build/rootfs
          # 「开机即联网」的能力：首启时自动读 provisioning 文件，配好 Wi-Fi 与 SSH。
          # 少了它，装完系统还得接显示器键盘手动敲 wpa_supplicant —— 这正是要避免的。
          [ -x "$ROOT/usr/local/sbin/qm1-firstboot" ] \
            || { echo "::error::镜像里没有 /usr/local/sbin/qm1-firstboot"; exit 1; }
          [ -f "$ROOT/etc/systemd/system/qm1-firstboot.service" ] \
            || { echo "::error::镜像里没有 qm1-firstboot.service"; exit 1; }
          [ -L "$ROOT/etc/systemd/system/multi-user.target.wants/qm1-firstboot.service" ] \
            || { echo "::error::首启配置单元没有开机自启（缺 multi-user.target.wants 链接）"; exit 1; }
          [ -f "$ROOT/etc/systemd/system/qm1-wifi@.service" ] \
            || { echo "::error::镜像里没有 qm1-wifi@.service"; exit 1; }
          grep -q 'qm1-firstboot.service' "$ROOT/etc/systemd/system/qm1-wifi@.service" \
            || { echo "::error::Wi-Fi 单元没有排在首启配置之后（会先于 provisioning 启动）"; exit 1; }
          echo "OK   首启自动配置（Wi-Fi/SSH）就位"

      - name: Assert the installer supports the non-destructive path
        run: |
          set -eu
          ROOT=build/rootfs
          INSTALLER="$ROOT/usr/local/sbin/qm1-install-to-emmc"
          # 安装器要支持「非破坏性」路径：装到可移动介质、eMMC 不动
          grep -q -- '--mode' "$INSTALLER" \
            || { echo "::error::安装器缺少 --mode（无法选择非破坏性安装路径）"; exit 1; }
          grep -q 'qm1/provision' "$INSTALLER" \
            || { echo "::error::安装器没有把 provisioning 写进目标（装完不会自动联网）"; exit 1; }
          grep -q 'BACKUP_DIR' "$INSTALLER" \
            || { echo "::error::安装器没有备份流程（覆盖 eMMC 前必须能整盘备份）"; exit 1; }
          echo "OK   安装器支持非破坏性路径 + 备份 + provisioning"

      - name: Assert QM1 hardware driver & firmware coverage
        run: |
          set -eu
          ROOT=build/rootfs
          rc=0
          # 驱动清单由 install-drivers.sh 在 chroot 内生成，这里先取出来再断言
          cp "$ROOT/usr/local/share/qm1/driver-manifest.txt" build/out/driver-manifest.txt

          # 1) 启动关键驱动必须存在于本镜像内核（module 或 builtin 都算有）
          for m in $QM1_CRITICAL_MODULES; do
            if grep -qE "^${m}[[:space:]]+(module|builtin)([[:space:]]|$)" build/out/driver-manifest.txt; then
              echo "OK   关键驱动 $m"
            else
              echo "::error::启动关键驱动缺失：$m（QM1 会认不到 eMMC/ESP，插电起不来）"
              rc=1
            fi
          done

          # 2) initramfs 里必须真的塞进了这些模块
          #    注意模块文件名里 MMC 用下划线（mmc_block.ko），其余用连字符，
          #    所以两种写法都要匹配。
          #
          #    坑：initrd.img 可能是「early cpio（Intel 微码）+ zstd 主归档」的拼接格式，
          #    直接 `zstd -dc` 会因为前缀不是 zstd 帧而解不出内容（grep 必然找不到）。
          #    所以改用 initramfs-tools 的 lsinitramfs 列举，它认识所有这些格式。
          initrd="$(ls "$ROOT"/boot/initrd.img-* 2>/dev/null | head -1 || true)"
          if [ -z "$initrd" ]; then
            echo "::error::镜像里没有 initrd.img-*"; rc=1
          else
            echo "initramfs: $initrd"
            listing="$(lsinitramfs "$initrd" 2>/dev/null || true)"
            if [ -z "$listing" ]; then
              echo "::warning::lsinitramfs 列举失败，回退到 unmkinitramfs"
              tmpd="$(mktemp -d)"
              unmkinitramfs "$initrd" "$tmpd" 2>/dev/null || true
              listing="$(find "$tmpd" -type f -printf '%p\n' 2>/dev/null || true)"
              rm -rf "$tmpd"
            fi
            printf '%s\n' "$listing" > build/out/initramfs-listing.txt
            echo "initramfs 条目数：$(printf '%s\n' "$listing" | grep -c . || true)"
            for m in sdhci[-_]pci sdhci[-_]acpi mmc[-_]block; do
              # herestring 而非管道：GitHub 的 bash 默认带 -o pipefail，
              # 管道里 grep -q 提前退出会让上游收到 SIGPIPE，管道返回 141，
              # 结果是"明明在清单里"却被判成"缺失"。
              if grep -aqE "$m" <<<"$listing"; then
                echo "OK   initramfs 含 $m"
              else
                echo "::error::initramfs 里没有 $m —— 根盘/ESP 阶段会挂不上"
                printf '%s\n' "$listing" | grep -aE 'sdhci|mmc' | head -10 || true
                rc=1
              fi
            done
          fi

          # 3) 非关键硬件驱动（缺失只告警，但必须写进清单）
          for m in $QM1_OPTIONAL_MODULES; do
            if grep -qE "^${m}[[:space:]]+(module|builtin)([[:space:]]|$)" build/out/driver-manifest.txt; then
              echo "OK   硬件驱动 $m"
            else
              echo "::warning::硬件驱动缺失：$m（不影响启动，但对应外设不可用）"
            fi
          done

          # 3b) 编译进内核的驱动：用内核 config 核对（没有 .ko，不能 modinfo）
          kcfg="$(ls "$ROOT"/boot/config-* 2>/dev/null | head -1 || true)"
          if [ -z "$kcfg" ]; then
            echo "::error::镜像里没有 /boot/config-*（无法核对内置驱动）"; rc=1
          else
            for m in $QM1_BUILTIN_MODULES; do
              # 内核 config 符号名与模块名不一定一致（6.12: rtc_cmos → RTC_DRV_CMOS）
              case "$m" in
                rtc_cmos) sym="CONFIG_RTC_DRV_CMOS" ;;
                *) sym="CONFIG_$(echo "$m" | tr 'a-z-' 'A-Z_')" ;;
              esac
              if grep -qE "^${sym}=y$" "$kcfg"; then
                echo "OK   内置驱动 $m（$sym=y）"
              else
                echo "::warning::内置驱动未确认：$m（$sym 不是 y）"
              fi
            done
          fi

          # 4) firmware 包必须装进镜像
          for p in $QM1_REQUIRED_FIRMWARE; do
            pkg_status="$(chroot "$ROOT" dpkg-query -W -f='${Status}' "$p" 2>/dev/null || true)"
            if [ "$pkg_status" = "install ok installed" ]; then
              echo "OK   firmware 包 $p"
            else
              echo "::error::firmware 包未装进镜像：$p"
              rc=1
            fi
          done

          # 5) 汇总固件 blob 落盘情况（无线芯片型号待上机确认，这里只报事实）
          echo "--- firmware blob ---"
          sed -n '/firmware blob/,$p' build/out/driver-manifest.txt | tee -a build/out/firmware-blobs.txt

          exit $rc

      - name: Verify ext4 image contents (debugfs, no mount)
        run: |
          bash scripts/verify-image.sh build/out/rootfs.img

      - name: Driver manifest review
        run: |
          set -eux
          cat build/rootfs/usr/local/share/qm1/driver-manifest.txt | tee build/out/driver-manifest.txt
          # 清单状态取值：module / builtin / absent
          if grep -qE '[[:space:]]absent([[:space:]]|$)' build/out/driver-manifest.txt; then
            echo "::warning::驱动清单中有 absent 项（多为需 DKMS 的 Realtek 芯片，属预期）"
            grep -E '[[:space:]]absent([[:space:]]|$)' build/out/driver-manifest.txt || true
          fi

      - name: Package inventory
        run: |
          cp build/rootfs-manifest.txt build/out/rootfs-manifest.txt 2>/dev/null || true
          cp build/rootfs.mmdebstrap.log build/out/mmdebstrap.log 2>/dev/null || true
          du -sh build/rootfs | tee build/out/rootfs-size.txt

      - name: Assemble installable disk image
        run: |
          set -eux
          bash scripts/assemble-disk.sh \
            --esp build/out/esp.img \
            --root build/out/rootfs.img \
            --out build/out/qm1-disk.img \
            --size-gib "${{ inputs.disk_size_gib || 30 }}"
          cp scripts/install-qm1.sh scripts/provision-agent.sh build/out/
          # 整盘镜像很大，压缩后再上传
          # -19 在 6.25GiB 镜像上要跑 ~9.5 分钟，-12 明显更快而体积只大一点
          zstd -12 -T0 --long=27 -f build/out/qm1-disk.img -o build/out/qm1-disk.img.zst
          ls -lh build/out/qm1-disk.img.zst
          sha256sum build/out/qm1-disk.img.zst >> build/out/SHA256SUMS

      - name: Assert the installer image is self-contained
        run: |
          set -eu
          # 安装介质 = 同一套内核/根文件系统 + 换了菜单的 ESP。
          # 写进 U 盘开机后，选第 ① 项就能把系统装到 eMMC。
          ROOT=build/rootfs
          [ -f build/out/qm1-installer.img ] || { echo "::error::没生成安装介质镜像"; exit 1; }
          # 1) 根文件系统里要有安装脚本与单元
          [ -x "$ROOT/usr/local/sbin/qm1-install-to-emmc" ] \
            || { echo "::error::镜像里没有 qm1-install-to-emmc"; exit 1; }
          [ -f "$ROOT/etc/systemd/system/qm1-install.service" ] \
            || { echo "::error::镜像里没有 qm1-install.service"; exit 1; }
          [ -L "$ROOT/etc/systemd/system/multi-user.target.wants/qm1-install.service" ] \
            || { echo "::error::安装单元没有开机自启（缺 multi-user.target.wants 链接）"; exit 1; }
          # 2) 安装介质 ESP 里要有：安装菜单 + 正常菜单（装完由脚本拷回目标 ESP）
          mdir -/ -i build/out/esp-installer.img ::/EFI/BOOT | tee build/out/esp-installer-listing.txt
          for f in BOOTIA32 BOOTX64 grub ; do
            grep -q "$f" build/out/esp-installer-listing.txt \
              || { echo "::error::安装介质 ESP 缺少 $f"; exit 1; }
          done
          grep -qi 'grub-normal' build/out/esp-installer-listing.txt \
            || { echo "::error::安装介质 ESP 缺少 grub-normal.cfg（装完无法换回正常菜单）"; exit 1; }
          # 3) 安装菜单里得有"安装到 eMMC"那一项，且带 qm1.install=1
          mcopy -i build/out/esp-installer.img ::/EFI/BOOT/grub.cfg build/out/installer-grub.cfg
          grep -q 'qm1.install=1' build/out/installer-grub.cfg \
            || { echo "::error::安装菜单缺少 qm1.install=1（安装动作不会触发）"; exit 1; }
          # 4) 设备端要能分区：sfdisk 来自 fdisk 包
          [ -x "$ROOT/usr/sbin/sfdisk" ] || [ -x "$ROOT/usr/bin/sfdisk" ] \
            || { echo "::error::镜像里没有 sfdisk（设备上无法给 eMMC 分区）"; exit 1; }
          echo "OK   安装介质（安装菜单 + 正常菜单 + 安装脚本 + sfdisk）齐备"
          zstd -12 -T0 --long=27 -f build/out/qm1-installer.img -o build/out/qm1-installer.img.zst
          ls -lh build/out/qm1-installer.img.zst
          sha256sum build/out/qm1-installer.img.zst >> build/out/SHA256SUMS

      - name: Assert runtime payload (profile=runtime)
        if: inputs.profile == 'runtime' || inputs.profile == ''
        run: |
          set -eu
          ROOT=build/rootfs
          rc=0
          # 浏览器（headless Chrome 会话用）
          [ -x "$ROOT/usr/bin/chromium" ] || { echo "::error::镜像内缺 chromium"; rc=1; }
          # standalone CPython 3.14（Hermes 官方安装器使用同一类产物）
          ls -d "$ROOT"/opt/qm1/python/*/bin/python3.14 >/dev/null 2>&1 \
            || { echo "::error::镜像内缺 standalone CPython 3.14"; rc=1; }
          # 设备端安装脚本（Hermes 官方安装方式 + systemd 单元）
          [ -f "$ROOT/usr/local/share/qm1/provision-agent.sh" ] \
            || { echo "::error::镜像内缺 provision-agent.sh"; rc=1; }
          # 驱动自检脚本
          [ -f "$ROOT/usr/local/lib/qm1/drv-selfcheck.sh" ] \
            || { echo "::error::镜像内缺 drv-selfcheck.sh"; rc=1; }
          [ "$rc" -eq 0 ] || exit 1
          echo "运行时载荷检查通过"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qm1-build-log
          path: |
            build/rootfs.mmdebstrap.log
            build/out/manifest.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload metadata artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qm1-image-metadata-${{ inputs.arch || 'amd64' }}-${{ inputs.profile || 'runtime' }}
          path: |
            build/out/manifest.txt
            build/out/driver-manifest.txt
            build/out/esp-listing.txt
            build/out/esp-installer-listing.txt
            build/out/installer-grub.cfg
            build/out/rootfs-manifest.txt
            build/out/rootfs-size.txt
            build/out/bootloaders/

      - name: Upload image artifacts (opt-in)
        if: inputs.upload_images == true
        uses: actions/upload-artifact@v4
        with:
          name: qm1-images-${{ inputs.arch || 'amd64' }}
          # 只传压缩包与清单，不传未压缩的整盘镜像（6 GiB 级的 .img 上传极慢）
          path: |
            build/out/qm1-disk.img.zst
            build/out/qm1-installer.img.zst
            build/out/SHA256SUMS
            build/out/manifest.txt
            build/out/install-qm1.sh
            build/out/provision-agent.sh
          compression-level: 6
          retention-days: 7
