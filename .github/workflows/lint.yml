name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-and-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(scripts/*.sh scripts/lib/*.sh)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::没有找到脚本"; exit 1; }
          for f in "${files[@]}"; do
            bash -n "$f"
            echo "ok: $f"
          done

      - name: Hooks syntax check (POSIX sh)
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(hooks/*.sh)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::没有找到 hooks"; exit 1; }
          for f in "${files[@]}"; do
            sh -n "$f"
            echo "ok: $f"
          done

      - name: ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -x -S warning scripts/*.sh scripts/lib/*.sh
          shellcheck -s sh -S warning hooks/*.sh

      - name: Scripts are executable
        run: |
          set -euo pipefail
          for f in scripts/*.sh hooks/*.sh; do
            [ -x "$f" ] || { echo "::error::$f 不可执行（需 chmod +x）"; exit 1; }
          done
          echo "all scripts executable"

      - name: Privacy scan (no local paths / private strings / device identifiers)
        run: |
          set -euo pipefail
          # 这个仓库是公开的。凡是「只对这台机器有意义」的东西都不能进来：
          #   * 本机/他人路径（/Users/…、/home/…）
          #   * 私有记忆库与联系方式（viking://、OpenViking、邮箱）
          #   * 内网地址、MAC 地址、eMMC CID/序列号、SSH host key、主机名
          # 之前只拦了路径和邮箱，设备局域网地址、MAC OUI、eMMC CID 都是从这条缝里漏出去的。
          if grep -rInE '(/home/[a-z]|/Users/|gmail\.com|qq\.com|viking://|OpenViking|BEGIN [A-Z ]*PRIVATE KEY)' \
               --exclude-dir=.git --exclude=lint.yml . ; then
            echo "::error::仓库中出现疑似本机路径或私人信息"
            exit 1
          fi
          # 内网地址（RFC1918）
          if grep -rInE '\b(192\.168\.[0-9]{1,3}\.[0-9]{1,3}|10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3})\b' \
               --exclude-dir=.git --exclude=lint.yml . ; then
            echo "::error::仓库中出现内网地址（设备/网关 IP 不该进公开仓库）"
            exit 1
          fi
          # MAC 地址
          if grep -rInE '\b([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}\b' \
               --exclude-dir=.git --exclude=lint.yml . ; then
            echo "::error::仓库中出现 MAC 地址"
            exit 1
          fi
          # eMMC CID / 序列号等唯一标识
          if grep -rInE '(CID `|serial `|serial=)0x?[0-9a-fA-F]{12,}' \
               --exclude-dir=.git --exclude=lint.yml . ; then
            echo "::error::仓库中出现存储卡 CID/序列号等唯一标识"
            exit 1
          fi
          # SSH host key 指纹
          if grep -rInE 'SHA256:[A-Za-z0-9+/]{20,}' \
               --exclude-dir=.git --exclude=lint.yml . ; then
            echo "::error::仓库中出现 SSH host key 指纹"
            exit 1
          fi
          # 设备主机名。用「任意 .lan 结尾的 mDNS 名」这种通用写法，
          # 规则本身就不指向某一台具体的机器。
          if grep -rInE '\b[a-z0-9-]+\.lan\b' \
               --exclude-dir=.git --exclude=lint.yml . ; then
            echo "::error::仓库中出现 mDNS 主机名"
            exit 1
          fi
          echo "privacy scan clean"

      - name: Overlay sanity (required files present)
        run: |
          set -euo pipefail
          for f in \
            overlay/etc/sysctl.d/90-qm1.conf \
            overlay/etc/default/zramswap \
            overlay/etc/wpa_supplicant/wpa_supplicant.conf \
            overlay/etc/systemd/network/10-ethernet.network \
            overlay/etc/systemd/network/30-wifi.network \
            overlay/etc/systemd/system/qm1-wifi@.service \
            overlay/etc/systemd/system/qm1-firstboot.service \
            overlay/usr/local/sbin/qm1-firstboot \
            overlay/usr/local/sbin/qm1-install-to-emmc \
            overlay/usr/local/bin/qm1-selftest \
            overlay/usr/local/sbin/qm1-health-collect \
            overlay/usr/local/bin/qm1-stress \
            overlay/etc/systemd/system/qm1-health-collect.service \
            overlay/etc/systemd/system/qm1-health-collect.timer \
            overlay/etc/systemd/system/qm1-hardware-fixups.service \
            overlay/usr/local/sbin/qm1-hardware-fixups \
            overlay/etc/default/qm1-hardware \
            overlay/etc/systemd/system/bluetooth.service.d/qm1.conf \
            scripts/grub.cfg.example \
            scripts/grub-installer.cfg.example \
            scripts/prepare-provision.sh \
            scripts/drv-selfcheck.sh ; do
            [ -f "$f" ] || { echo "::error::缺少 $f"; exit 1; }
          done
          echo "overlay ok"
